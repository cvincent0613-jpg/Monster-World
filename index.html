<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>異寵世界・原型 v23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eefa;--panel:#fbf9fe;--panel2:#efe8fa;--ink:#2a2340;--ink2:#6c6386;--line:#ddd3ee;
  --accent:#7a4fd6;--on-accent:#ffffff;--hp:#e2526b;--gold:#b77f0c;
  --r0:#8a8a9c;--r1:#3f7ff0;--r2:#c29405;--r3:#e5701a;--r4:#1f9d55;
  --navh:72px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
    --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
    --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;--r4:#4be08a;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
  --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
  --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;--r4:#4be08a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{position:fixed;inset:0;touch-action:none;display:block}

#hud{position:fixed;top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hudcard{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;min-width:0;width:max-content;max-width:calc(100vw - var(--miniw) - 34px);box-sizing:border-box;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#who{font-weight:700;font-size:15px;overflow-wrap:anywhere}
body.nomini .hudcard{max-width:calc(100vw - 20px)}
body.nomini #mini{display:none}
.hprow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.hpbg{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#hpBar{height:100%;background:var(--hp);width:100%;transition:width .15s}
.hudsub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;font-size:13px}
#gold{color:var(--gold);font-weight:700}
#zoneHud{color:var(--ink2);align-self:center}
#eatBtn{pointer-events:auto;margin-left:auto;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-size:14px;cursor:pointer}

#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;z-index:6;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:92px;background:none;border:0;border-radius:12px;padding:6px 0 4px;color:var(--ink2);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#nav button .i{font-size:21px;line-height:1.2}
#nav button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);font-weight:700}

#panel{position:fixed;left:0;right:0;bottom:var(--navh);max-height:54vh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;display:none;flex-direction:column;z-index:7;box-shadow:0 -6px 24px rgba(30,15,60,.12)}
#panel.open{display:flex}
@media (min-width:820px){
  #panel{left:auto;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(var(--navh) + 12px);width:390px;max-height:none;
    border:1px solid var(--line);border-radius:18px}
}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.phead h2{margin:0;font-size:21px}
.x{background:var(--panel2);border:0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
#pbody{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.muted{color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.slot{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;padding:0}
.slot .tb{position:absolute;left:4px;top:1px;font-size:10px;color:var(--ink2);font-weight:700}
.slot .up{position:absolute;right:2px;top:0;font-size:12px;color:#2fb86a;font-weight:700;text-shadow:0 0 2px var(--panel)}
.slot .up.no{color:var(--ink2)}.slot .up.lk{font-size:9px}
.slot.other{opacity:.55}
.doll{display:grid;grid-template-columns:66px 1fr 66px;gap:8px;align-items:center;margin-bottom:6px}
.dcol{display:flex;flex-direction:column;gap:7px}
.dslot{aspect-ratio:auto;height:62px;flex-direction:column;font-size:22px;width:100%}
.dslot small{font-size:10px;color:var(--ink2);margin-top:1px}
.fig{display:flex;flex-direction:column;align-items:center}.fig svg{width:100%;max-width:150px;height:auto}
.cp{font-size:26px;font-weight:700;color:var(--accent);text-align:center;line-height:1.1}.cp small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.cmp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cmp .cpd{font-weight:700;font-size:16px;margin-top:2px}
.pos{color:#2fb86a}.neg{color:var(--hp)}
.qsrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.qsrow label{width:52px;font-size:14px}
.qsrow select{flex:1;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
.qsck{display:flex;gap:6px;align-items:center;margin-top:4px}
#evHud{font-size:12px;color:#d39a12;font-weight:700;margin-top:2px;max-width:260px}
.rfb{border:0;background:none;cursor:pointer;font-size:12px;padding:0 2px}.rfb:disabled{opacity:.3;cursor:default}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.ab .u{font-size:13px;margin-bottom:4px}.ab .u.dead{opacity:.4}
.alog{font-size:12px;line-height:1.6;color:var(--ink2);background:var(--panel2);border-radius:10px;padding:6px 10px;min-height:7em}
.slot .sk{position:absolute;left:3px;bottom:0;font-size:8px;letter-spacing:-1px;color:var(--accent)}
#storyHud{font-size:12px;color:var(--ink2);margin-top:2px;max-width:260px}
#cpHud{font-size:13px;color:var(--accent);font-weight:700;margin-top:2px}
.slot .q{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700}
.slot.sel{outline:2px solid var(--accent);outline-offset:1px}
.slot.empty{cursor:default;opacity:.55}
.detail{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.detail h3{margin:0 0 4px;font-size:18px}
.detail ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.uq{color:var(--r3);font-size:14px;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:24px;width:32px;text-align:center}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.lv{font-weight:700;font-size:18px;min-width:44px;text-align:right}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eqs .slot{aspect-ratio:auto;height:74px;flex-direction:column;font-size:24px}
.eqs .slot small{font-size:11px;color:var(--ink2);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2)}
.dex .big{font-size:32px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--accent);color:var(--on-accent);vertical-align:2px}
.danger{margin-top:18px;background:none;border:0;color:var(--hp);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

#skbar{position:fixed;right:12px;bottom:calc(var(--navh) + 12px);display:flex;flex-direction:column;gap:10px;z-index:5}
#skbar button{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:24px;position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(30,15,60,.18);touch-action:manipulation;overflow:hidden;padding:0}
#skbar button .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(20,10,40,.62) calc(var(--p,0)*1turn),transparent 0)}
#skbar button .k{position:absolute;bottom:2px;font-size:10px;color:var(--ink2);font-weight:700}
#skbar button.lock{opacity:.5;font-size:18px}
#skbar .skset{width:40px;height:40px;font-size:18px;align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{border-color:var(--accent);outline:1px solid var(--accent)}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.heart{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}.heart i{display:block;height:100%;background:#ff7fb0}
.row.selp{background:var(--panel2);border-radius:12px;padding-left:8px;padding-right:8px}
#log{position:fixed;left:10px;bottom:calc(var(--navh) + 8px);max-width:min(440px,70vw);pointer-events:none;z-index:4;font-size:13px}
#log div{background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:8px;padding:3px 8px;margin-top:3px;width:fit-content;transition:opacity .6s}
#photoBar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 10px;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:calc(100vw - 20px)}
#photoBar button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 9px;font-size:13px;cursor:pointer}
#photoBar .pt{width:100%;text-align:center;font-size:11px;color:var(--ink2)}
body.photo #photoBar{display:flex}body.photo #hud,body.photo #nav,body.photo #skbar,body.photo #log,body.photo #toast,body.photo #panel{display:none !important}
#mini{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:var(--miniw);height:calc(var(--miniw) * .75);border-radius:12px;border:1px solid var(--line);z-index:5;cursor:pointer;background:#000;box-shadow:0 3px 10px rgba(30,15,60,.18)}
:root{--miniw:144px}
#mini{pointer-events:auto}
@media (min-width:700px){#mini{position:static;width:190px;height:142px}.hudcard{max-width:min(360px,calc(100vw - 20px))}}
@media (max-width:480px){:root{--miniw:104px}.hudcard{padding:6px 10px 8px}#who{font-size:14px}.hudsub{font-size:12px}}
@media (max-width:360px){:root{--miniw:88px}}
@media (max-width:600px){#toast{top:calc(128px + env(safe-area-inset-top,0px)) !important}}
.hbtn{pointer-events:auto;margin-left:auto;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 8px;font-size:14px;cursor:pointer}
#sndBtn+#eatBtn,#mapBtn+#sndBtn{margin-left:6px}
#mapBtn{display:none}body.nomini #mapBtn{display:inline-block}
.enh{color:var(--accent)}
.enhbox{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#buffHud{font-size:12px}
#bagHud{color:var(--hp);font-weight:700;font-size:12px}
.slot .lk2{position:absolute;left:2px;bottom:0;font-size:10px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ach .e{font-size:22px;width:28px;text-align:center}.ach.no{opacity:.55}
.set{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
#toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:0 6px 20px rgba(30,15,60,.18);animation:tin .25s ease-out;text-align:center}
#toast div.leg{border:2px solid var(--r3);color:var(--r3);font-size:18px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}

#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#start .card{max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 22px;max-width:440px;width:100%;text-align:center}
#start h1{margin:0;font-size:56px;letter-spacing:.12em;font-weight:700;line-height:1.1}
#start .sub{color:var(--ink2);margin:8px 0 18px;font-size:15px}
#start input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.cls button{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:10px 8px;cursor:pointer}
.cls button[aria-pressed="true"]{border-color:var(--accent)}
.cls .ce{font-size:28px}
.cls b{display:block;font-size:18px;margin-top:2px}
.cls span{display:block;font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.4}
#start .btn{width:100%;padding:12px;font-size:17px}
#start .cont{margin-bottom:14px}

/* ===== v23 美化 ===== */
.hudcard{box-shadow:0 6px 22px rgba(30,15,60,.16);background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 94%,transparent),color-mix(in srgb,var(--panel2) 90%,transparent))}
.hrow1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#cpHud{margin-top:0;background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:1px 8px;font-size:12px}
.hpbg{position:relative;height:16px;border-radius:8px;margin-top:6px;background:color-mix(in srgb,var(--hp) 16%,var(--panel2));overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
#hpBar{background:linear-gradient(180deg,color-mix(in srgb,var(--hp) 80%,#fff),var(--hp));border-radius:8px}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.hudsub{margin-top:5px}.qbtns{gap:6px}.qbtns .hbtn{margin:0;padding:3px 9px}
#photoBtn,#mapBtn,#sndBtn{display:none !important}body.nomini #mapBtn{display:inline-block !important}
#storyHud,#evHud{margin-top:5px;padding:3px 8px;border-radius:8px;background:var(--panel2);line-height:1.4}#storyHud:empty,#evHud:empty{display:none}
#evHud{background:color-mix(in srgb,#ffd23a 18%,var(--panel2))}
@media (min-width:700px){#mini{border-radius:14px;box-shadow:0 6px 22px rgba(30,15,60,.16)}}
#nav{box-shadow:0 -4px 18px rgba(30,15,60,.08)}
#nav button{position:relative;transition:background .15s,color .15s}
#nav button[aria-pressed="true"]::after{content:'';position:absolute;bottom:2px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--accent)}
#panel.open{animation:pup .22s ease-out}@keyframes pup{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#panel.open{animation:none}}
.phead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:6px}
.phead h2{display:flex;align-items:center;gap:8px}.phead h2::before{content:'';width:6px;height:20px;border-radius:3px;background:var(--accent)}
h3.sec{margin:16px 0 6px;font-size:15px;padding-left:8px;border-left:3px solid var(--accent)}
.row{transition:background .12s}button.row:hover{background:var(--panel2)}
.btn{transition:transform .08s,filter .15s;box-shadow:0 2px 6px rgba(30,15,60,.12)}.btn:hover:not(:disabled){filter:brightness(1.07)}.btn:active:not(:disabled){transform:scale(.96)}
.btn.ghost{box-shadow:none}.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.chip{transition:background .12s}.chip:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.slot{transition:transform .08s}.slot:hover:not(.empty){transform:translateY(-1px)}
.detail{box-shadow:0 2px 10px rgba(30,15,60,.06)}
.bar{height:7px;border-radius:4px}.bar i{border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff))}
#toast div{border-left:4px solid var(--accent);backdrop-filter:blur(6px)}#toast div.leg{border-left-width:6px}
#skbar button{box-shadow:0 4px 14px rgba(30,15,60,.22);background:radial-gradient(circle at 35% 30%,var(--panel),var(--panel2))}
#skbar button:active{transform:scale(.93)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),var(--panel2));cursor:pointer;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}.tile .te{font-size:28px}.tile b{font-size:14px}.tile small{font-size:11px;color:var(--accent)}
#start .card{box-shadow:0 20px 60px rgba(30,15,60,.25);background:linear-gradient(170deg,var(--panel),var(--panel2))}
#start h1{background:linear-gradient(135deg,var(--accent),#ff8fb1 55%,#ffd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cls button{transition:transform .1s}.cls button:hover{transform:translateY(-2px)}.cls button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
</style>
</head>
<body>
<canvas id="c" aria-label="遊戲畫面"></canvas>

<div id="hud"><div class="hudcard">
  <div class="hrow1"><div id="who">—</div><div id="cpHud"></div></div>
  <div class="hpbg"><div id="hpBar"></div><span id="hpTxt">0</span></div>

  const span=Math.max(60,t-l[0][0]);return l.reduce((a,b)=>a+b[1],0)/span*3600;}
const fmtEta=h=>h<1/60?'1 分鐘內':h<1?Math.ceil(h*60)+' 分鐘':h<48?(Math.round(h*10)/10)+' 小時':Math.round(h/24)+' 日';

function sockHTML(it,equipped){const n=it.sock||0,mx=SOCKMAX[it.slot]||1;if(!n&&!wearable(it))return '';const gems=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].gemk);
  let h=`<div class="enhbox" style="display:block"><b>寶石插槽 ${n}/${mx}</b><div class="chips" style="margin-top:4px">`;
  for(let i=0;i<n;i++){const g=(it.gems||[])[i];h+=g?`<button class="chip" data-a="ungem" data-v="${i}" title="撳一下拆出（${200*(g.t+1)} 金）">${GEMS[g.g].e} ${GEMT[g.t]}${GEMS[g.g].n}・${gemTxt(g.g,g.t)}</button>`:'<span class="chip" style="opacity:.6">○ 空插槽</span>';}
  h+='</div>';
  if(n&&(it.gems||[]).filter(Boolean).length<n){h+=gems.length?`<div class="muted" style="margin-top:6px">揀寶石鑲入空插槽：</div><div class="chips">${gems.map(g=>`<button class="chip" data-a="gemin" data-k="${g.m}">${MATS[g.m].e} ${MATS[g.m].n}×${g.q}</button>`).join('')}</div>`:'<div class="muted" style="margin-top:4px">背包冇寶石。喺工作台用寶石原石切割，或者打首領會跌。</div>';}

const sockCost=it=>({st:5*((it.sock||0)+1),g:500*((it.sock||0)+1)*(it.tier+1)});
function gemIn(it,k){const n=it.sock||0;it.gems=it.gems||[];let i=-1;for(let j=0;j<n;j++)if(!it.gems[j]){i=j;break;}if(i<0||!hasMat(k))return;const m=MATS[k];useMat(k,1);it.gems[i]={g:m.gemk,t:m.gt};sfx('rare');toast(`鑲嵌咗${m.n}`);dirty();}
function gemOut(it,i){const g=it.gems&&it.gems[i];if(!g)return;const c=200*(g.t+1);if(S.gold<c)return toast('金幣唔夠');if(!addMat('gem_'+g.g+g.t))return toast('背包已滿');S.gold-=c;it.gems[i]=null;dirty();}
function addSock(it){const c=sockCost(it);if((it.sock||0)>=(SOCKMAX[it.slot]||1)||hasMat('stone')<c.st||S.gold<c.g)return;useMat('stone',c.st);S.gold-=c.g;it.sock=(it.sock||0)+1;sfx('rare');toast(`打孔成功！而家有 ${it.sock} 個插槽`);dirty();}

  if(!addMat('gem_'+g+'0')){addMat('gem',3);return toast('背包已滿');}gainXP('smithing',120);toast(`💎 切割出${MATS['gem_'+g+'0'].n}`);sfx('rare');}

const KEYS={};const MVK={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]};

/* ---------- 戰鬥技能 ---------- */
function skTarget(range){const a=P.action;if(a&&a.type==='attack'&&!a.m.dead&&Math.hypot(a.m.x-P.x,a.m.y-P.y)<=range)return a.m;
  let b=null,bd=range;for(const m of Z.mons){if(m.dead)continue;const d=Math.hypot(m.x-P.x,m.y-P.y);if(d<=bd){bd=d;b=m;}}return b;}
const bfv=k=>P.bf&&P.bf[k]&&P.bf[k].end>now()?P.bf[k].v:0;
function effP(id){const D=SKD[id],me=S.sk[id];let p={...D.p};const vi=me&&me.var!=null?me.var:-1;if(vi>=0&&D.v[vi])p={...p,...D.v[vi].p};return p;}
const skMul=id=>1+.1*(((S.sk[id]||{}).lv||1)-1);
function skDesc(id){const D=SKD[id],p=effP(id),M=Math.round((p.mul||0)*skMul(id)*100),x=[];
  if(D.k==='aoe')x.push(`對身邊 ${p.r} 格內所有敵人造成 ${M}% 傷害`);
  else if(D.k==='proj')x.push(p.count>1?`向 ${p.range} 格內最多 ${p.count} 個目標各發射一發，每發 ${M}% 傷害`:p.shots>1?`向目標連續發射 ${p.shots} 發，每發 ${M}% 傷害`:`對 ${p.range} 格內目標造成 ${M}% 傷害`);
  else if(D.k==='dash')x.push(`衝到 ${p.range} 格內目標${p.back?'背後':'身邊'}，造成 ${M}%${p.crit?' 必定暴擊':''}傷害`);
  else if(D.k==='meteor')x.push(`${p.delay} 秒後喺目標位置${p.count>1?`落下 ${p.count} 次`:'爆炸'}，對 ${p.r} 格內敵人造成 ${M}% 傷害`);
  else if(D.k==='pet')x.push(`出戰異寵撲向 ${p.range} 格內目標，造成 ${M}% 傷害${p.r?`，並波及 ${p.r} 格內敵人`:''}`);
  else if(D.k==='heal')x.push(`即時回復 ${Math.round(p.heal*100)}% 生命${p.mul?`，並對${p.count>1?`最多 ${p.count} 個`:''}目標造成 ${M}% 傷害`:''}`);
  if(D.k==='buff'){if(p.heal)x.push(`即時回復 ${Math.round(p.heal*100)}% 生命`);if(p.shield)x.push(`${p.dur} 秒內護盾吸收 ${Math.round(p.shield*100)}% 生命上限的傷害`);if(p.r)x.push(`對身邊 ${p.r} 格內敵人造成 ${M}% 傷害`);}
  if(p.splash)x.push(`命中時爆炸波及 ${p.splash} 格`);if(p.slow)x.push(`減速 ${p.slow} 秒`);if(p.stun)x.push(`暈眩 ${p.stun} 秒`);
  if(p.dot)x.push(`${p.dot.dur} 秒內再造成合共 ${Math.round(p.dot.mul*skMul(id)*100)}% 持續傷害`);if(p.hh)x.push(`每命中一個敵人回復 ${Math.round(p.hh*100)}% 生命`);
  if(p.land)x.push(`落地時對 ${p.land} 格內敵人造成 ${Math.round(p.lmul*skMul(id)*100)}% 傷害`);
  if(p.b)x.push(`${p.dur} 秒內`+Object.entries(p.b).map(([k,v])=>BFI[k][1]+v+BFI[k][2]).join('、'));
  return x.join('，')+`。冷卻 ${p.cd} 秒。`;}
function skHit(m,M,p,fc){if(m.dead)return;if(p.slow)m.slow=Math.max(m.slow||0,p.slow);if(p.stun)m.stun=Math.max(m.stun||0,p.stun);
  if(p.dot){const st=stats();m.dot={dps:st.atk*p.dot.mul*(p.lm||1)/p.dot.dur,end:now()+p.dot.dur,acc:0};}if(M>0)playerHit(m,M,fc);else m.aggro=true;}
function skAoe(x,y,r,M,p){let n=0;for(const m of Z.mons)if(!m.dead&&!(m.mod&&m.mod.goblin&&false)&&Math.hypot(m.x-x,m.y-y)<=r){skHit(m,M,p);n++;}return n;}
function nearMons(r,n){return Z.mons.filter(m=>!m.dead&&Math.hypot(m.x-P.x,m.y-P.y)<=r).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y)).slice(0,n);}
function applyBuffs(p){const t=now(),st=stats();if(p.heal){const h=Math.round(st.hp*p.heal);P.hp=Math.min(st.hp,P.hp+h);floater(P.x,P.y-1.1,'+'+h,'#7dff9a',15);}
  if(p.shield){P.shield=Math.round(st.hp*p.shield);P.shieldT=t+p.dur;}if(p.b){P.bf=P.bf||{};for(const k in p.b)P.bf[k]={v:p.b[k],end:t+p.dur};}SC=null;}
const pcast=[];
function castSkill(i){if(!started)return;const id=S.bar[i];if(!id||!S.sk[id]||SKD[id].c!==S.cls)return;const D=SKD[id],t=now();
  if((cds[id]||0)>t)return;const p=effP(id),lm=skMul(id),M=(p.mul||0)*lm,st=stats();p.lm=lm;
  if(D.k==='aoe'){const n=skAoe(P.x,P.y,p.r,M,p);if(p.hh&&n)P.hp=Math.min(st.hp,P.hp+st.hp*Math.min(.5,p.hh*n));if(p.b)applyBuffs(p);fx.push({x:P.x,y:P.y,r:p.r,col:p.col||'#fff',t:0});if(!n&&!p.b)floater(P.x,P.y-1,'冇命中','#cfcfe0',11);}
  else if(D.k==='buff'){applyBuffs(p);if(p.r){skAoe(P.x,P.y,p.r,M,p);fx.push({x:P.x,y:P.y,r:p.r,col:p.col||'#ffd27a',t:0});}floater(P.x,P.y-1.4,D.n+'！',p.col||'#ffd27a',15);}
  else if(D.k==='heal'){applyBuffs({heal:p.heal});if(p.mul){const ts=nearMons(p.range,p.count||1);for(const m of ts)projs.push({x:P.x,y:P.y-.3,m,mult:M,eff:p,col:p.col});}}
  else{const rg=p.range,ts=p.count>1?nearMons(rg,p.count):[skTarget(rg)].filter(Boolean);if(!ts.length)return toast(`${rg} 格內冇目標`);
    if(D.k==='pet'&&!activePet())return toast('要有出戰異寵先可以用');const m=ts[0];
    if(!P.action||P.action.type!=='attack'||P.action.m.dead)setAction({type:'attack',m,rp:0});
    if(D.k==='proj'){for(const tg of ts){tg.aggro=true;for(let k=0;k<(p.shots||1);k++)projs.push({x:P.x+(k?rnd(-.4,.4):0),y:P.y-.3+(k?rnd(-.4,.4):0),m:tg,mult:M,eff:p,col:p.col,arrow:p.arrow,big:p.big});}}
    else if(D.k==='dash'){const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||1,sg=p.back?-1:1;let nx=m.x+sg*dx/d*.9,ny=m.y+sg*dy/d*.9;
      if(blocked(Math.floor(nx),Math.floor(ny))){nx=m.x+dx/d*.9;ny=m.y+dy/d*.9;}if(!blocked(Math.floor(nx),Math.floor(ny))){P.x=nx;P.y=ny;}P.path=[];
      fx.push({x:m.x,y:m.y,r:1.2,col:p.back?'#ff6b8a':'#ffffff',t:0});skHit(m,M,p,!!p.crit);if(p.land){skAoe(m.x,m.y,p.land,p.lmul*lm,{});fx.push({x:m.x,y:m.y,r:p.land,col:'#d9a25a',t:0});}}
    else if(D.k==='pet'){pet.x=m.x-.6;pet.y=m.y;fx.push({x:m.x,y:m.y,r:p.r||1.2,col:'#ffcf8a',t:0});skHit(m,M,p);if(p.r)skAoe(m.x,m.y,p.r,M*.6,{...p,stun:0});}
    else if(D.k==='meteor'){for(let k=0;k<(p.count||1);k++){const ox=k?rnd(-1.5,1.5):0,oy=k?rnd(-1.5,1.5):0;pcast.push({x:m.x+ox,y:m.y+oy,t:-k*.35,delay:p.delay,r:p.r,M,p});}}}
  cds[id]=t+p.cd*(1-Math.min(.5,st.cdr/100));
  const me=S.sk[id];if(me.lv<SKMAX){me.xp++;if(me.xp>=skNeed(me.lv)){me.xp=0;me.lv++;toast(`📘 ${D.n}升到 Lv${me.lv}！${VLV.includes(me.lv)?'解鎖新技能變化':''}`,VLV.includes(me.lv));sfx('lvl');}}dirty();
}
const useSkill=castSkill;
function ensureSkills(){S.sk=S.sk||{};const c=lvl('combat');for(const id of SKC[S.cls]){const D=SKD[id];if(!D.book&&c>=D.lv&&!S.sk[id]){S.sk[id]={lv:1,xp:0,var:null};}}
  S.bar=(S.bar||[]).filter(id=>id&&SKD[id]&&SKD[id].c===S.cls&&S.sk[id]);
  for(const id of SKC[S.cls])if(S.sk[id]&&S.bar.length<4&&!S.bar.includes(id))S.bar.push(id);
  while(S.bar.length<4)S.bar.push(null);}
function readBook(k){const id=MATS[k].book,D=SKD[id];if(D.c!==S.cls)return toast(`呢本係${CLS[D.c].n}的技能書`);
  if(lvl('combat')<D.lv)return toast(`需要戰鬥 ${D.lv} 級先睇得明`);const me=S.sk[id];
  if(!me){S.sk[id]={lv:1,xp:0,var:null};useMat(k,1);ensureSkills();buildSkillBar();toast(`📘 學會新技能「${D.n}」！`,true);sfx('leg');}
  else if(me.lv>=SKMAX)return toast('呢個技能已經滿級');else{useMat(k,1);me.lv++;me.xp=0;toast(`📘 ${D.n}升到 Lv${me.lv}！${VLV.includes(me.lv)?'解鎖新技能變化':''}`,true);sfx('lvl');}dirty();}
function dropBook(x,y){const c=Math.random()<.9?S.cls:pick(Object.keys(CLS)),id=pick(SKC[c]);if(addMat('book_'+id)){toast(`📘 獲得技能書「${SKD[id].n}」（${CLS[c].n}）`);beam(x,y,'#6fb4ff',false);}}
function changeClass(c){if(S.gold<1000||c===S.cls)return;S.gold-=1000;const old=S.cls;S.cls=c;
  for(const k of EQK){const it=S.eq[k];if(it&&!wearable(it)){S.eq[k]=null;if(!addItem(it))S.bank.push(it);}}
  if(!S.eq.weapon)S.eq.weapon={k:'gear',u:++S.uid,slot:'weapon',cls:c,fam:c,tier:0,name:STARTW[c],val:2,rar:0,aff:[],uq:null,il:1,req:1};
  SC=null;for(const k in cds)delete cds[k];S.bar=[];P.bf={};P.hp=Math.min(P.hp,stats().hp);buildSkillBar();toast(`轉職成為${CLS[c].n}！（${CLS[old].n}的裝備已放返背包）`,true);sfx('lvl');dirty();}
function buildSkillBar(){ensureSkills();const B=$('#skbar');B.innerHTML='';
  for(let i=0;i<4;i++){const b=document.createElement('button');b.dataset.i=i;b.addEventListener('pointerdown',e=>{e.preventDefault();if(!S.bar[i])return openPanel('cskill');castSkill(i);});B.appendChild(b);}
  const g=document.createElement('button');g.className='skset';g.setAttribute('aria-label','技能設定');g.textContent='📘';g.addEventListener('click',()=>{if(started)openPanel('cskill');});B.appendChild(g);updSkillBar();}
function updSkillBar(){const t=now();[...$('#skbar').children].forEach((b,i)=>{if(i>3)return;const id=S.bar[i],D=id&&SKD[id];
  const key=D?id+(S.sk[id]?S.sk[id].var:''):'E';if(b.dataset.st!==key){b.dataset.st=key;b.className=D?'':'lock';b.setAttribute('aria-label',D?`${D.n}（${i+1}）`:'空技能欄');b.title=D?`${D.n}（${i+1}）\n${skDesc(id)}`:'空技能欄，撳入去設定';
    b.innerHTML=D?`${D.e}<span class="cd"></span><span class="k">${i+1}</span>`:`＋<span class="k">${i+1}</span>`;}
  if(D){const c=b.querySelector('.cd'),r=Math.max(0,(cds[id]||0)-t)/effP(id).cd;c.style.setProperty('--p',Math.min(1,r).toFixed(3));}});}

function feedPet(u){const p=S.pets.find(x=>x.u===u);if(!p)return;if((p.aff||0)>=100)return toast('親密度已經滿咗');
  const foods=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].heal).sort((a,b)=>MATS[a.m].heal-MATS[b.m].heal);if(!foods.length)return toast('冇食物。釣魚再去營火煮熟就有');
  const f=foods[0],tt=MATS[f.m].t;useMat(f.m,1);p.aff=Math.min(100,(p.aff||0)+4+tt*3);petGain(p,30+tt*40);gainXP('taming',10+tt*8);
  floater(S.active===u?pet.x:P.x,(S.active===u?pet.y:P.y)-1,'💗 +'+(4+tt*3),'#ff9ec8',14);if(p.aff>=100)toast(`💗 ${SP[p.sp].n}親密度滿咗！`);dirty();}
function awaken(u){const p=S.pets.find(x=>x.u===u),s=SP[p.sp];if(!p||p.awake||(p.aff||0)<100||lvl('taming')<s.lv+10)return;
  p.awake=true;gainXP('taming',200+s.lv*15);toast(`✨ ${s.n}覺醒了！天賦效果大增`,true);beam(S.active===u?pet.x:P.x,S.active===u?pet.y:P.y,'#ffd56b',true);dirty();}
function openBox(){useMat('cosbox',1);const pool=Object.values(COS).filter(c=>c.box&&!S.cos.own.includes(c.id));
  if(!pool.length){S.gold+=500;toast('寶箱時裝已經集齊，改為獲得 500 金');return;}
  const c=pick(pool);S.cos.own.push(c.id);toast(`🎁 開到 ${c.kind==='hat'?c.e+' ':''}${c.n}！去裝備面板換上`,true);beam(P.x,P.y,'#ffb3e6',true);dirty();}
function genQuest(){const opts=[],act=S.quests.map(q=>q.type+':'+q.key);
  for(const sk of ['mining','woodcut','fishing']){let b=null;for(const id in RES){const r=RES[id];if(r.sk===sk&&r.lv<=lvl(sk)&&(!b||r.lv>b.lv))b=r;}
    const n=ri(15,35);opts.push({type:'gather',key:b.mat,n:`收集 ${n} 個${MATS[b.mat].n}`,need:n,xpk:sk,xp:Math.round(b.xp*n*.5),gold:Math.round(n*MATS[b.mat].p*1.5)});}
  const c=lvl('combat'),ms=Object.keys(MON).filter(k=>!MON[k].boss&&MON[k].lv<=c+3).sort((a,b)=>MON[b].lv-MON[a].lv).slice(0,2);
  if(ms.length){const k=pick(ms),n=ri(8,20);opts.push({type:'kill',key:k,n:`擊敗 ${n} 隻${MON[k].n}`,need:n,xpk:'combat',xp:Math.round(MON[k].xp*n*.4),gold:Math.round(n*MON[k].gold[1]*.8)});}
  const ct=tierOf(Math.min(lvl('cooking'),lvl('fishing')));{const n=ri(10,25);opts.push({type:'cook',key:null,n:`煮好 ${n} 份食物`,need:n,xpk:'cooking',xp:Math.round(FXP[ct]*n*.5),gold:Math.round(n*price(ct)*2)});}
  {const b=MON[dunPool(S.zone).boss];opts.push({type:'dungeon',key:null,n:'完成 1 次任何難度的地城',need:1,xpk:'combat',xp:Math.round(b.xp*1.5),gold:b.lv*40});}
  {const n=ri(2,4);opts.push({type:'catch',key:null,n:`捕捉或孵化 ${n} 隻異寵`,need:n,xpk:'taming',xp:(40+lvl('taming')*6)*n,gold:n*60});}
  const pool=opts.filter(o=>!act.includes(o.type+':'+o.key));const q=pick(pool.length?pool:opts);q.id=++S.uid;q.have=0;return q;}
function fillQuests(){while(S.quests.length<3)S.quests.push(genQuest());}
function questProgress(type,key,n=1){if(!S)return;storyProg(type,key,n);npcProg(type,key,n);for(const q of S.quests)if(q.type===type&&(q.key==null||q.key===key)&&q.have<q.need){q.have=Math.min(q.need,q.have+n);
  if(q.have===q.need){toast(`📜 委託完成：${q.n}`);addLog('撳「任務」領取獎勵','#b99cff');}dirty();}}
function claimQuest(id){const i=S.quests.findIndex(q=>q.id===id);if(i<0)return;const q=S.quests[i];if(q.have<q.need)return;
  S.quests.splice(i,1);S.gold+=q.gold;S.qdone++;gainXP(q.xpk,q.xp);toast(`📜 領取 ${q.gold} 金同 ${q.xp.toLocaleString()} ${SK[q.xpk].n}經驗`);fillQuests();dirty();}
function hud(){if(!S)return;const st=stats();$('#who').textContent=`${S.name}・${CLS[S.cls].n}・戰鬥 ${lvl('combat')} 級`;$('#evHud').textContent=(season()?`${season().e} ${season().n}活動中・${MATS[season().cur].e}${hasMat(season().cur)}　`:'')+(ev?`${ev.e} ${ev.n}・${fmtLeft((ev.end-now())*1000)}・${ev.d}`:'');$('#rideBtn').style.display=mountPet()?'':'none';$('#rideBtn').textContent=S.riding?'🐎':'🚶';

  const f=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].heal).reduce((a,b)=>a+b.q,0);$('#eatBtn').textContent=`🍱 ${f}`;
  const pq=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].pot==='hp').reduce((a,b)=>a+b.q,0);$('#potBtn').textContent=`🧪 ${pq}`;$('#potBtn').style.display=pq?'':'none';}

let hold=null,hover=null;

cv.addEventListener('pointerleave',()=>{hover=null;});

/* ---------- 開始畫面 ---------- */
let chosen='warrior';
function startScreen(){const old=load();const C=$('#startCard');
  C.innerHTML=`<h1>異寵世界</h1><div class="sub">練技能、刷裝備、收集異寵的冒險原型</div><div class="muted" style="margin:-10px 0 14px">版本 ${VERSION}</div>
    ${old?`<button class="btn cont" id="cont">繼續冒險：${esc(old.name)}（${CLS[old.cls].n}）</button><div class="muted" style="margin-bottom:12px">或者建立新角色（會覆蓋舊存檔）</div>`:''}
    <input id="nm" maxlength="8" placeholder="輸入角色名稱" value="">
    <div class="cls">${Object.entries(CLS).map(([k,c])=>`<button data-c="${k}" aria-pressed="${k===chosen}"><div class="ce">${c.e}</div><b>${c.n}</b><span>${c.d}</span></button>`).join('')}</div>
    <button class="btn" id="go">建立角色，開始冒險</button>`;
  C.querySelectorAll('.cls button').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.c;C.querySelectorAll('.cls button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===chosen));}));
  if(old)$('#cont').addEventListener('click',()=>begin(old,false));
  $('#go').addEventListener('click',()=>{const n=$('#nm').value.trim()||'冒險者';begin(newSave(n,chosen),true);});}
function begin(s,fresh){S=migrate(s);S.uid=S.uid||1;started=true;$('#start').style.display='none';
  SC=null;Z=getZone(S.zone);P.x=Z.camp[0];P.y=Z.camp[1];pet.x=P.x-1;pet.y=P.y;P.hp=stats().hp;
  setTimeout(dailyLogin,1500);if(Z.id==='house')initHousePets();fillQuests();buildSkillBar();storyCheck();save();hud();if(S.set.snd)sfx('coin');
  if(fresh){addLog('撳地面行路；撳樹伐木、撳礦石挖礦、撳湖邊漣漪釣魚');addLog('南面荒野平原有怪物，跌落的裝備會偏向你的職業');addLog('鎮內有工作台、銀行、營火同時裝店；東面傳送門通往翠影深林');addLog('右下角係戰鬥技能（電腦可按 1、2、3），📜 任務有委託可以接');}
  else addLog(`歡迎返嚟，${S.name}！`);}

/* ---------- 主迴圈 ---------- */
let last=performance.now(),hudT=0,saveT=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;SC=null;
  if(started){update(dt);hudT-=dt;saveT-=dt;achT-=dt;if(achT<=0){achT=1;checkAch();for(const p of S.pets)if(p.exp&&!p.exp.nt&&Date.now()>=p.exp.end){p.exp.nt=1;toast(`🧭 ${SP[p.sp].n}探險返嚟喇！去異寵面板領取`);}if(curPanel==='pets'&&petTab==='exp')renderPanel();}miniT-=dt;if(miniT<=0){miniT=.25;if(!S.set.noMini)drawMini();}
    if(hudT<=0){hudT=.15;hud();updSkillBar();if(panelDirty&&curPanel)renderPanel();}if(saveT<=0&&needSave){saveT=4;needSave=false;save();}}
  render();requestAnimationFrame(loop);}
addEventListener('pagehide',()=>{if(S)save();});
addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});
Z=getZone('village');resize();startScreen();requestAnimationFrame(loop);
</script>
</body>
</html>
