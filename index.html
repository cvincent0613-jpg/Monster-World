<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>異寵世界・原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eefa;--panel:#fbf9fe;--panel2:#efe8fa;--ink:#2a2340;--ink2:#6c6386;--line:#ddd3ee;
  --accent:#7a4fd6;--on-accent:#ffffff;--hp:#e2526b;--gold:#b77f0c;
  --r0:#8a8a9c;--r1:#3f7ff0;--r2:#c29405;--r3:#e5701a;
  --navh:72px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
    --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
    --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
  --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
  --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{position:fixed;inset:0;touch-action:none;display:block}

#hud{position:fixed;top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5}
.hudcard{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;min-width:0;width:max-content;max-width:calc(100vw - var(--miniw) - 34px);box-sizing:border-box;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#who{font-weight:700;font-size:15px;overflow-wrap:anywhere}
body.nomini .hudcard{max-width:calc(100vw - 20px)}
body.nomini #mini{display:none}
.hprow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.hpbg{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#hpBar{height:100%;background:var(--hp);width:100%;transition:width .15s}
.hudsub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;font-size:13px}
#gold{color:var(--gold);font-weight:700}
#zoneHud{color:var(--ink2);align-self:center}
#eatBtn{pointer-events:auto;margin-left:auto;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-size:14px;cursor:pointer}

#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;z-index:6;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:92px;background:none;border:0;border-radius:12px;padding:6px 0 4px;color:var(--ink2);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#nav button .i{font-size:21px;line-height:1.2}
#nav button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);font-weight:700}

#panel{position:fixed;left:0;right:0;bottom:var(--navh);max-height:54vh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;display:none;flex-direction:column;z-index:7;box-shadow:0 -6px 24px rgba(30,15,60,.12)}
#panel.open{display:flex}
@media (min-width:820px){
  #panel{left:auto;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(var(--navh) + 12px);width:390px;max-height:none;
    border:1px solid var(--line);border-radius:18px}
}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.phead h2{margin:0;font-size:21px}
.x{background:var(--panel2);border:0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
#pbody{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.muted{color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.slot{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;padding:0}
.slot .tb{position:absolute;left:4px;top:1px;font-size:10px;color:var(--ink2);font-weight:700}
.slot .up{position:absolute;right:2px;top:0;font-size:12px;color:#2fb86a;font-weight:700;text-shadow:0 0 2px var(--panel)}
.slot .up.no{color:var(--ink2)}.slot .up.lk{font-size:9px}
.slot.other{opacity:.55}
.doll{display:grid;grid-template-columns:66px 1fr 66px;gap:8px;align-items:center;margin-bottom:6px}
.dcol{display:flex;flex-direction:column;gap:7px}
.dslot{aspect-ratio:auto;height:62px;flex-direction:column;font-size:22px;width:100%}
.dslot small{font-size:10px;color:var(--ink2);margin-top:1px}
.fig{display:flex;flex-direction:column;align-items:center}.fig svg{width:100%;max-width:150px;height:auto}
.cp{font-size:26px;font-weight:700;color:var(--accent);text-align:center;line-height:1.1}.cp small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.cmp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cmp .cpd{font-weight:700;font-size:16px;margin-top:2px}
.pos{color:#2fb86a}.neg{color:var(--hp)}
.qsrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.qsrow label{width:52px;font-size:14px}
.qsrow select{flex:1;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
.qsck{display:flex;gap:6px;align-items:center;margin-top:4px}
#cpHud{font-size:13px;color:var(--accent);font-weight:700;margin-top:2px}
.slot .q{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700}
.slot.sel{outline:2px solid var(--accent);outline-offset:1px}
.slot.empty{cursor:default;opacity:.55}
.detail{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.detail h3{margin:0 0 4px;font-size:18px}
.detail ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.uq{color:var(--r3);font-size:14px;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:24px;width:32px;text-align:center}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.lv{font-weight:700;font-size:18px;min-width:44px;text-align:right}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eqs .slot{aspect-ratio:auto;height:74px;flex-direction:column;font-size:24px}
.eqs .slot small{font-size:11px;color:var(--ink2);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2)}
.dex .big{font-size:32px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--accent);color:var(--on-accent);vertical-align:2px}
.danger{margin-top:18px;background:none;border:0;color:var(--hp);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

#skbar{position:fixed;right:12px;bottom:calc(var(--navh) + 12px);display:flex;flex-direction:column;gap:10px;z-index:5}
#skbar button{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:24px;position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(30,15,60,.18);touch-action:manipulation;overflow:hidden;padding:0}
#skbar button .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(20,10,40,.62) calc(var(--p,0)*1turn),transparent 0)}
#skbar button .k{position:absolute;bottom:2px;font-size:10px;color:var(--ink2);font-weight:700}
#skbar button.lock{opacity:.45;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{border-color:var(--accent);outline:1px solid var(--accent)}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.heart{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}.heart i{display:block;height:100%;background:#ff7fb0}
.row.selp{background:var(--panel2);border-radius:12px;padding-left:8px;padding-right:8px}
#log{position:fixed;left:10px;bottom:calc(var(--navh) + 8px);max-width:min(440px,70vw);pointer-events:none;z-index:4;font-size:13px}
#log div{background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:8px;padding:3px 8px;margin-top:3px;width:fit-content;transition:opacity .6s}
#mini{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:var(--miniw);height:calc(var(--miniw) * .75);border-radius:12px;border:1px solid var(--line);z-index:5;cursor:pointer;background:#000;box-shadow:0 3px 10px rgba(30,15,60,.18)}
:root{--miniw:144px}
@media (max-width:480px){:root{--miniw:104px}.hudcard{padding:6px 10px 8px}#who{font-size:14px}.hudsub{font-size:12px}}
@media (max-width:360px){:root{--miniw:88px}}
@media (max-width:600px){#toast{top:calc(128px + env(safe-area-inset-top,0px)) !important}}
.hbtn{pointer-events:auto;margin-left:auto;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 8px;font-size:14px;cursor:pointer}
#sndBtn+#eatBtn,#mapBtn+#sndBtn{margin-left:6px}
#mapBtn{display:none}body.nomini #mapBtn{display:inline-block}
.enh{color:var(--accent)}
.enhbox{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#buffHud{font-size:12px}
#bagHud{color:var(--hp);font-weight:700;font-size:12px}
.slot .lk2{position:absolute;left:2px;bottom:0;font-size:10px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ach .e{font-size:22px;width:28px;text-align:center}.ach.no{opacity:.55}
.set{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
#toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:0 6px 20px rgba(30,15,60,.18);animation:tin .25s ease-out;text-align:center}
#toast div.leg{border:2px solid var(--r3);color:var(--r3);font-size:18px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}

#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#start .card{max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 22px;max-width:440px;width:100%;text-align:center}
#start h1{margin:0;font-size:56px;letter-spacing:.12em;font-weight:700;line-height:1.1}
#start .sub{color:var(--ink2);margin:8px 0 18px;font-size:15px}
#start input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.cls button{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:10px 8px;cursor:pointer}
.cls button[aria-pressed="true"]{border-color:var(--accent)}
.cls .ce{font-size:28px}
.cls b{display:block;font-size:18px;margin-top:2px}
.cls span{display:block;font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.4}
#start .btn{width:100%;padding:12px;font-size:17px}
#start .cont{margin-bottom:14px}
</style>
</head>
<body>
<canvas id="c" aria-label="遊戲畫面"></canvas>

<div id="hud"><div class="hudcard">
  <div id="who">—</div>
  <div id="cpHud"></div>
  <div class="hprow"><div class="hpbg"><div id="hpBar"></div></div><span id="hpTxt">0</span></div>
  <div class="hudsub"><span>🪙 <span id="gold">0</span></span><span id="petHud"></span><span id="buffHud"></span><span id="bagHud"></span></div>
  <div class="hudsub"><span id="zoneHud"></span><button id="mapBtn" class="hbtn" aria-label="世界地圖">🗺️</button><button id="sndBtn" class="hbtn" aria-label="音效">🔊</button><button id="eatBtn" aria-label="食物">🍱 0</button></div>
</div></div>

<canvas id="mini" aria-label="小地圖，撳開世界地圖"></canvas>
<div id="log" aria-live="polite"></div>
<div id="skbar" aria-label="戰鬥技能"></div>
<div id="toast"></div>

<div id="panel" role="dialog" aria-labelledby="ptitle">
  <div class="phead"><h2 id="ptitle"></h2><button class="x" id="pclose" aria-label="關閉">✕</button></div>
  <div id="pbody"></div>
</div>

<nav id="nav">
  <button data-p="bag" aria-pressed="false"><span class="i">🎒</span>背包</button>
  <button data-p="equip" aria-pressed="false"><span class="i">🛡️</span>裝備</button>
  <button data-p="skills" aria-pressed="false"><span class="i">📈</span>技能</button>
  <button data-p="pets" aria-pressed="false"><span class="i">🐾</span>異寵</button>
  <button data-p="ach" aria-pressed="false"><span class="i">🏆</span>成就</button>
  <button data-p="quest" aria-pressed="false"><span class="i">📜</span>任務</button>
</nav>

<div id="start"><div class="card" id="startCard"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TS=40, MW=48, MH=36, INV_MAX=28, PET_MAX=30, BANK_MAX=300, KEY='yichong-world-save-v1';
const cv=$('#c'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,camX=0,camY=0;
const ecache=new Map();
function resize(){chunkC.clear();DPR=Math.min(window.devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';ecache.clear();
  const nh=$('#nav').getBoundingClientRect().height;document.documentElement.style.setProperty('--navh',nh+'px');}
addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wpick=(arr,wf)=>{let t=0;for(const x of arr)t+=wf(x);let r=Math.random()*t;for(const x of arr){r-=wf(x);if(r<=0)return x;}return arr[arr.length-1];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>performance.now()/1000;

/* ---------- 等級曲線：前期同 RuneScape，12 級之後每級額外加難，專練一個技能到 99 約 300 小時 ---------- */
const XPT=[0,0];
{let pts=0;const base=[0,0];for(let l=1;l<99;l++){pts+=Math.floor(l+300*Math.pow(2,l/7));base.push(Math.floor(pts/4));}
 let acc=0;for(let L=1;L<99;L++){acc+=Math.round((base[L+1]-base[L])*(1+Math.max(0,L-12)/25));XPT.push(acc);}}
const lvlOf=xp=>{let l=1;while(l<99&&xp>=XPT[l+1])l++;return l;};

/* ---------- 資料 ---------- */
const TREQ=[1,15,30,45,60,75,90];
const tierOf=il=>{let t=0;for(let i=0;i<7;i++)if(il>=TREQ[i])t=i;return t;};
const CLS={
  warrior:{n:'戰士',e:'⚔️',w:'🗡️',col:'#d65a4a',d:'近身肉搏，皮厚耐打',arm:'heavy',main:'str',rng:0,spd:.9,hpM:1.1,crit:0,proj:null,wm:1},
  mage:{n:'法師',e:'🔮',w:'🪄',col:'#6d63d9',d:'遠距離法術，範圍控場',arm:'cloth',main:'int',rng:4.6,spd:1.15,hpM:.95,crit:0,proj:'#b9a6ff',wm:1},
  ranger:{n:'遊俠',e:'🏹',w:'🏹',col:'#3f9a5a',d:'最遠射程，一次射多個目標',arm:'leather',main:'dex',rng:5.6,spd:1,hpM:.95,crit:5,proj:'#c9f29b',wm:.95},
  priest:{n:'祭司',e:'🌟',w:'🔱',col:'#d9a92e',d:'會治療自己，持久耐戰',arm:'cloth',main:'int',rng:4.2,spd:1.2,hpM:1.05,crit:0,proj:'#fff1a8',wm:.9,regen:.01},
  assassin:{n:'刺客',e:'🌙',w:'🔪',col:'#4a4a68',d:'極快近戰，高暴擊爆發',arm:'leather',main:'dex',rng:0,spd:.6,hpM:.9,crit:12,proj:null,wm:.65},
  beast:{n:'御獸師',e:'🐾',w:'📯',col:'#c0743a',d:'異寵同你一齊戰鬥，天賦效果 +50%',arm:'leather',main:'dex',rng:3.2,spd:1.1,hpM:1,crit:0,proj:'#ffcf8a',wm:.8,pet:1}
};
const ARMN={heavy:'重甲',cloth:'布甲',leather:'皮甲'},ARMMAIN={heavy:'str',cloth:'int',leather:'dex'};
const famOf=it=>it.fam||(it.cls==='any'?'any':it.slot==='weapon'?it.cls:(it.cls==='warrior'?'heavy':it.cls==='mage'?'cloth':it.cls));
const wearable=it=>{const f=famOf(it);return f==='any'||f===S.cls||f===CLS[S.cls].arm;};
const famName=f=>f==='any'?'全職業':CLS[f]?CLS[f].n+'用':ARMN[f]+'（'+Object.values(CLS).filter(c=>c.arm===f).map(c=>c.n).join('、')+'）';
const mainOf=f=>f==='any'?CLS[S.cls].main:CLS[f]?CLS[f].main:ARMMAIN[f];

    rooms=[];for(let k=0;k<500&&rooms.length<9;k++){const w=ri(6,10),h=ri(5,8),x=ri(2,MW-w-3),y=ri(2,MH-h-3);
      if(rooms.every(r=>x+w+2<r.x||r.x+r.w+2<x||y+h+2<r.y||r.y+r.h+2<y))rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});}}while(rooms.length<5);
  rooms.sort((a,b)=>(a.cx+a.cy)-(b.cx+b.cy));
  for(const r of rooms)rect(r.x,r.y,r.x+r.w-1,r.y+r.h-1,(x,y)=>z.tile[idx(x,y)]=TN);
  const cor=(x0,y0,x1,y1)=>rect(Math.min(x0,x1),Math.min(y0,y1),Math.max(x0,x1)+(y0===y1?0:1),Math.max(y0,y1)+(y0===y1?1:0),(x,y)=>{if(z.tile[idx(x,y)]===WL)z.tile[idx(x,y)]=PA;});
  const dig=(a,b)=>{if(sr()<.5){cor(a.cx,a.cy,b.cx,a.cy);cor(b.cx,a.cy,b.cx,b.cy);}else{cor(a.cx,a.cy,a.cx,b.cy);cor(a.cx,b.cy,b.cx,b.cy);}};
  for(let i=0;i<rooms.length-1;i++)dig(rooms[i],rooms[i+1]);
  for(let k=0;k<2;k++)dig(pick(rooms),pick(rooms));
  const st=rooms[0],bs=rooms[rooms.length-1],mid=rooms.slice(1,-1);
  portal(z,st.x+1,st.y+1,zone);z.camp=[st.cx+.5,st.cy+.5];z.labels=[['出口',st.x+1.5,st.y+.4]];z.pets=[];z.meadow=null;z.fount=null;z.spawns=[];
  const base={hp:D.hp,am:D.am,rw:D.rw,ilb:D.ilb,luck:D.luck,noresp:1,aggro:4.5,leash:14};
  for(const r of mid){const rr=[r.x+1,r.y+1,r.x+r.w-2,r.y+r.h-2],n=ri(3,5);
    for(let i=0;i<n;i++){const mod={...base};if(i===0&&Math.random()<.35){const e=pick(ELITE);mod.elite=e;mod.hp*=2.5;mod.am*=1.25;if(e.k!=='leech')mod[e.k]=(mod[e.k]||1)*e.v;else mod.leech=1;}
      z.mons.push(spawnMon(pick(pool.mons),rr,null,z,mod));}}
  z.mons.push(spawnMon(pool.boss,[bs.cx-1,bs.cy-1,bs.cx+1,bs.cy+1],null,z,{...base,hp:D.hp*.8,aggro:5}));
  const cr=[...mid].sort(()=>Math.random()-.5).slice(0,2);for(const r of cr)z.obj[idx(r.x+r.w-2,r.y+1)]={type:'chest'};
  z.dun={zone,di,total:z.mons.length,killed:0,done:false,t0:now(),bs};return z;}

}

function freeMove(dx,dy,dt){const d=Math.hypot(dx,dy);if(d<.01)return;P.path=[];if(P.action&&P.action.type!=='attack')setAction(null);
  const sp=P.speed*(P.buffMs>now()?1.3:1)*dt,nx=P.x+dx/d*sp,ny=P.y+dy/d*sp,r=.3;
  const ok=(x,y)=>!blocked(Math.floor(x-r),Math.floor(y))&&!blocked(Math.floor(x+r),Math.floor(y))&&!blocked(Math.floor(x),Math.floor(y-r*.6))&&!blocked(Math.floor(x),Math.floor(y+r*.6));
  if(ok(nx,P.y))P.x=nx;if(ok(P.x,ny))P.y=ny;if(Math.abs(dx)>.01)P.face=dx<0?-1:1;}
function updatePlayer(dt){
  P.atkCd=Math.max(0,P.atkCd-dt);P.eatCd=Math.max(0,P.eatCd-dt);
  {let kx=0,ky=0;for(const k in KEYS){kx+=MVK[k][0];ky+=MVK[k][1];}
   if(kx||ky){if(P.action&&P.action.type==='attack')setAction(null);freeMove(kx,ky,dt);return;}
   if(hold&&hold.ground&&now()-hold.t>.25){const wx=(hold.x+camX)/TS,wy=(hold.y+camY)/TS;if(Math.hypot(wx-P.x,wy-P.y)>.35){setAction(null);freeMove(wx-P.x,wy-P.y,dt);}return;}}
  if(P.path.length){const [tx,ty]=P.path[0],gx=tx+.5,gy=ty+.5,dx=gx-P.x,dy=gy-P.y,d=Math.hypot(dx,dy),st=P.speed*(P.buffMs>now()?1.3:1)*dt;
    if(Math.abs(dx)>.01)P.face=dx<0?-1:1;
    if(d<=st){P.x=gx;P.y=gy;P.path.shift();}else{P.x+=dx/d*st;P.y+=dy/d*st;}}
  const a=P.action;if(!a)return;

    if(d>range){a.rp-=dt;if(a.rp<=0||!P.path.length){a.rp=.35;const [sx,sy]=ptile();P.path=findPath(sx,sy,(x,y)=>Math.hypot(x+.5-m.x,y+.5-m.y)<=range-.25)||[];}return;}
    P.path=[];P.face=m.x<P.x?-1:1;
    if(P.atkCd<=0){P.atkCd=C.spd*(P.buffAs>now()?.67:1);m.aggro=true;
      if(!C.proj)playerHit(m);else projs.push({x:P.x,y:P.y-.3,m,col:C.proj,arrow:S.cls==='ranger'});}
    return;}
  if(P.path.length)return;
  if(a.type==='open'){setAction(null);openPanel(a.p,true);return;}
  if(a.type==='portal'){setAction(null);travel(a.to);return;}
  if(a.type==='chest'){setAction(null);openChest(Z.obj[idx(a.ox,a.oy)]);return;}
  if(a.type==='gather'){const o=Z.obj[idx(a.ox,a.oy)];if(!o||o.dep>0){setAction(null);return;}const R=RES[o.type];
    if(!canAddMat(R.mat)){setAction(null);toast('背包已滿，返營地用銀行存嘢');return;}
    P.face=a.ox+.5<P.x?-1:1;a.t+=dt*(1+stats().gather/100);
    if(a.t>=R.cyc){a.t=0;const ch=Math.min(.95,.45+(lvl(R.sk)-R.lv)*.03);
      if(Math.random()<ch){addMat(R.mat);floater(a.ox+.5,a.oy,`+1 ${MATS[R.mat].e}`,'#ffffff',13);
        const st=stats();if(st.extra&&Math.random()<st.extra/100&&addMat(R.mat))floater(a.ox+.5,a.oy-.4,'豐收 +1','#ffb43a',13);
        sfx('gather');gainXP(R.sk,R.xp);questProgress('gather',R.mat);
        if(R.gem&&Math.random()<R.gem&&addMat('gem')){toast('💎 挖到寶石原石！');beam(a.ox+.5,a.oy+.5,'#7fe3ff',false);}
        if(R.kind==='fish'&&Math.random()<.004&&addMat('egg')){toast('🥚 釣到一隻異寵蛋！');beam(a.ox+.5,a.oy+.5,'#ff9ee0',false);}
        if(Math.random()<R.dep){o.dep=R.resp;Z.dep.push(o);autoNext(o.type,a.ox,a.oy);}}
      else floater(a.ox+.5,a.oy,R.kind==='fish'?'走甩咗':'失手','#cfcfe0',11);}
    return;}
  if(a.type==='cook'){if(!nearObj('fire')||hasMat(a.k)<1||a.left<=0){setAction(null);return;}

  }

let spawnT=0;
function update(dt){
  if(Z.dun){if(!Z.seen)Z.seen=new Uint8Array(MW*MH);const px=Math.floor(P.x),py=Math.floor(P.y);for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++)if(inb(px+dx,py+dy))Z.seen[idx(px+dx,py+dy)]=1;}
  const t=now();
  updatePlayer(dt);
  const st=stats();
  for(const m of Z.mons){const d=MON[m.t];
    if(m.dead){if(m.mod&&m.mod.noresp)continue;m.resp-=dt;if(m.resp<=0)spawnMon(m.t,m.r,m);continue;}
    m.flash=Math.max(0,m.flash-dt);m.hop+=dt*(m.aggro?9:4);m.slow=Math.max(0,(m.slow||0)-dt);
    if(m.stun>0){m.stun-=dt;continue;}
    const dist=Math.hypot(P.x-m.x,P.y-m.y);
    const ag=(m.mod&&m.mod.aggro)||d.aggro;if(!m.aggro&&ag&&dist<ag)m.aggro=true;
    if(m.aggro){const r=m.r,lsh=(m.mod&&m.mod.leash)||4;
      if(P.x<r[0]-lsh||P.x>r[2]+lsh+1||P.y<r[1]-lsh||P.y>r[3]+lsh+1){m.aggro=false;m.hp=m.maxhp;m.goal=null;continue;}
      if(dist>.85+d.r*.6)steer(m,P.x,P.y,d.spd*MM(m,'sm')*(m.slow>0?.5:1),dt);
      else{m.atkCd-=dt;if(m.atkCd<=0){m.atkCd=1.4;let dmg=Math.max(1,Math.round(d.atk*MM(m,'am')*rnd(.8,1.2)-st.def*.6));if(m.mod&&m.mod.leech)m.hp=Math.min(m.maxhp,m.hp+dmg*.3);
        if(P.buffDR>t)dmg=Math.max(1,Math.round(dmg*.6));if(P.shield>0&&P.shieldT>t){const ab=Math.min(P.shield,dmg);P.shield-=ab;dmg-=ab;if(ab)floater(P.x+.4,P.y-1,'吸收 '+ab,'#9fe3ff',12);}
        P.lastHit=t;if(dmg>0){P.hp-=dmg;sfx('hurt');if(dmg>st.hp*.12)addShake(Math.min(1,dmg/st.hp*3));floater(P.x,P.y-.8,'-'+dmg,'#ff6b6b',14);if(P.hp<=0)die();}}}}
    else{if(!m.goal||Math.random()<.004){m.goal=Math.random()<.5?randIn(m.r):[m.x,m.y];}
      if(steer(m,m.goal[0],m.goal[1],d.spd*.35,dt))m.goal=null;}
  }
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];if(p.m.dead){projs.splice(i,1);continue;}
    const dx=p.m.x-p.x,dy=p.m.y-.3-p.y,d=Math.hypot(dx,dy);if(d<.3){if(p.slow)p.m.slow=p.slow;playerHit(p.m,p.mult||1);projs.splice(i,1);continue;}
    const s=Math.min(d,(p.arrow?15:10)*dt);p.x+=dx/d*s;p.y+=dy/d*s;}
  for(const w of Z.wild){w.hop+=dt*5;if(w.hold)continue;
    if(w.flee>0){w.flee-=dt;const dx=w.x-P.x,dy=w.y-P.y,d=Math.hypot(dx,dy)||1;steer(w,w.x+dx/d,w.y+dy/d,3,dt);continue;}
    if(!w.goal||Math.random()<.003)w.goal=randIn(Z.meadow);if(steer(w,w.goal[0],w.goal[1],.9,dt))w.goal=null;}
  spawnT-=dt;if(spawnT<=0){spawnT=6;if(Z.pets.length&&Z.wild.length<6)spawnWild();}
  for(let i=Z.dep.length-1;i>=0;i--){const o=Z.dep[i];o.dep-=dt;if(o.dep<=0){o.dep=0;Z.dep.splice(i,1);}}
  const ap=activePet();
  const tg=ap&&CLS[S.cls].pet&&P.action&&P.action.type==='attack'&&!P.action.m.dead?P.action.m:null;
  if(tg){const dx=tg.x-pet.x,dy=tg.y-pet.y,d=Math.hypot(dx,dy);if(d>.9){const s=Math.min(d-.8,6*dt);pet.x+=dx/d*s;pet.y+=dy/d*s;}
    P.petCd=(P.petCd||0)-dt;if(d<1.4&&P.petCd<=0){P.petCd=1.2;playerHit(tg,.45*(P.buffPet>t?2:1));}}
  else if(ap){const tx=P.x-.75*P.face,ty=P.y+.25,dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy);
    if(d>8){pet.x=tx;pet.y=ty;}else if(d>.15){const s=Math.min(d,(d>2?7:3.5)*dt);pet.x+=dx/d*s;pet.y+=dy/d*s;}}
  if(S.set.autoEat&&P.hp<st.hp*.35&&P.eatCd<=0&&bestFood())eat();
  let rg=st.regen+(CLS[S.cls].regen?st.hp*CLS[S.cls].regen:0);if(t-P.lastHit>4)rg+=st.hp*.02;if(Z.fount&&Math.hypot(P.x-Z.fount[0],P.y-Z.fount[1])<2.6)rg+=st.hp*.12;
  P.hp=Math.min(st.hp,P.hp+rg*dt);
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.y-=dt*.7;if(f.t>1.2)floaters.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>.5)fx.splice(i,1);}
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;if(b.t>b.dur)beams.splice(i,1);}
  if(marker){marker.t+=dt;if(marker.t>.6)marker=null;}
}

const CH=8,chunkC=new Map();let chunkZ=null;

  else if(id==='rhythm'){P.buffCrit=t+8;floater(P.x,P.y-1.1,'致命節奏','#ff6b8a',15);}
  else if(id==='wild'){P.buffPet=t+10;floater(P.x,P.y-1.1,'野性怒吼！','#ffcf8a',16);fx.push({x:pet.x,y:pet.y,r:2,col:'#ffcf8a',t:0});}
  else if(id==='holy'){const h=Math.round(st.hp*.3);P.hp=Math.min(st.hp,P.hp+h);floater(P.x,P.y-1.1,'+'+h,'#7dff9a',15);const m=skTarget(5);if(m)projs.push({x:P.x,y:P.y-.3,m,mult:1.5,col:'#fff1a8',big:0});}
  else if(id==='multi'){const ts=Z.mons.filter(m=>!m.dead&&Math.hypot(m.x-P.x,m.y-P.y)<=6).sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y)).slice(0,4);
    if(!ts.length)return toast('6 格內冇目標');for(const m of ts){m.aggro=true;projs.push({x:P.x,y:P.y-.3,m,mult:1.6,col:'#c9f29b',arrow:1});}if(!P.action||P.action.type!=='attack')setAction({type:'attack',m:ts[0],rp:0});}
  else{const rg=id==='pounce'?7:6,m=skTarget(rg);if(!m)return toast(`${rg} 格內冇目標`);
    if(id==='pounce'&&!activePet())return toast('要有出戰異寵先可以用');
    setAction({type:'attack',m,rp:0});
    if(id==='charge'||id==='backstab'){const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||1,sg=id==='backstab'?-1:1;let nx=m.x+sg*dx/d*.9,ny=m.y+sg*dy/d*.9;
      if(blocked(Math.floor(nx),Math.floor(ny))){nx=m.x+dx/d*.9;ny=m.y+dy/d*.9;}if(!blocked(Math.floor(nx),Math.floor(ny))){P.x=nx;P.y=ny;}P.path=[];
      fx.push({x:m.x,y:m.y,r:1.2,col:id==='charge'?'#ffffff':'#ff6b8a',t:0});if(id==='charge'){m.stun=2;playerHit(m,2.5);}else playerHit(m,3.5,true);}
    else if(id==='pounce'){pet.x=m.x-.6;pet.y=m.y;m.stun=1;fx.push({x:m.x,y:m.y,r:1.2,col:'#ffcf8a',t:0});playerHit(m,3);}
    else if(id==='pierce')projs.push({x:P.x,y:P.y-.3,m,mult:3,col:'#e6ffb0',arrow:1,slow:4});
    else projs.push({x:P.x,y:P.y-.3,m,mult:2.6,big:1});}
  cds[id]=t+s.cd;
}
function changeClass(c){if(S.gold<1000||c===S.cls)return;S.gold-=1000;const old=S.cls;S.cls=c;
  for(const k of EQK){const it=S.eq[k];if(it&&!wearable(it)){S.eq[k]=null;if(!addItem(it))S.bank.push(it);}}
  if(!S.eq.weapon)S.eq.weapon={k:'gear',u:++S.uid,slot:'weapon',cls:c,fam:c,tier:0,name:STARTW[c],val:2,rar:0,aff:[],uq:null,il:1,req:1};
  SC=null;for(const k in cds)delete cds[k];P.hp=Math.min(P.hp,stats().hp);buildSkillBar();toast(`轉職成為${CLS[c].n}！（${CLS[old].n}的裝備已放返背包）`,true);sfx('lvl');dirty();}
function buildSkillBar(){const B=$('#skbar');B.innerHTML='';
  CSK[S.cls].forEach((s,i)=>{const b=document.createElement('button');b.dataset.i=i;b.setAttribute('aria-label',s.n+'：'+s.d);b.title=`${s.n}（${i+1}）\n${s.d}`;
    b.addEventListener('pointerdown',e=>{e.preventDefault();useSkill(i);});B.appendChild(b);});updSkillBar();}
function updSkillBar(){const t=now();[...$('#skbar').children].forEach((b,i)=>{const s=CSK[S.cls][i],lock=lvl('combat')<s.lv;
  const key=lock?'L'+s.lv:'U';if(b.dataset.st!==key){b.dataset.st=key;b.className=lock?'lock':'';b.innerHTML=lock?`🔒<span class="k">Lv${s.lv}</span>`:`${s.e}<span class="cd"></span><span class="k">${i+1}</span>`;}
  if(!lock){const c=b.querySelector('.cd'),r=Math.max(0,(cds[s.id]||0)-t)/s.cd;c.style.setProperty('--p',r.toFixed(3));}});}

/* ---------- 異寵養成、時裝、委託 ---------- */
function feedPet(u){const p=S.pets.find(x=>x.u===u);if(!p)return;if((p.aff||0)>=100)return toast('親密度已經滿咗');
  const foods=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].heal).sort((a,b)=>MATS[a.m].heal-MATS[b.m].heal);if(!foods.length)return toast('冇食物。釣魚再去營火煮熟就有');
  const f=foods[0],tt=MATS[f.m].t;useMat(f.m,1);p.aff=Math.min(100,(p.aff||0)+4+tt*3);gainXP('taming',10+tt*8);
  floater(S.active===u?pet.x:P.x,(S.active===u?pet.y:P.y)-1,'💗 +'+(4+tt*3),'#ff9ec8',14);if(p.aff>=100)toast(`💗 ${SP[p.sp].n}親密度滿咗！`);dirty();}
function awaken(u){const p=S.pets.find(x=>x.u===u),s=SP[p.sp];if(!p||p.awake||(p.aff||0)<100||lvl('taming')<s.lv+10)return;
  p.awake=true;gainXP('taming',200+s.lv*15);toast(`✨ ${s.n}覺醒了！天賦效果大增`,true);beam(S.active===u?pet.x:P.x,S.active===u?pet.y:P.y,'#ffd56b',true);dirty();}
function openBox(){useMat('cosbox',1);const pool=Object.values(COS).filter(c=>c.box&&!S.cos.own.includes(c.id));
  if(!pool.length){S.gold+=500;toast('寶箱時裝已經集齊，改為獲得 500 金');return;}
  const c=pick(pool);S.cos.own.push(c.id);toast(`🎁 開到 ${c.kind==='hat'?c.e+' ':''}${c.n}！去裝備面板換上`,true);beam(P.x,P.y,'#ffb3e6',true);dirty();}
function genQuest(){const opts=[],act=S.quests.map(q=>q.type+':'+q.key);
  for(const sk of ['mining','woodcut','fishing']){let b=null;for(const id in RES){const r=RES[id];if(r.sk===sk&&r.lv<=lvl(sk)&&(!b||r.lv>b.lv))b=r;}
    const n=ri(15,35);opts.push({type:'gather',key:b.mat,n:`收集 ${n} 個${MATS[b.mat].n}`,need:n,xpk:sk,xp:Math.round(b.xp*n*.5),gold:Math.round(n*MATS[b.mat].p*1.5)});}
  const c=lvl('combat'),ms=Object.keys(MON).filter(k=>!MON[k].boss&&MON[k].lv<=c+3).sort((a,b)=>MON[b].lv-MON[a].lv).slice(0,2);
  if(ms.length){const k=pick(ms),n=ri(8,20);opts.push({type:'kill',key:k,n:`擊敗 ${n} 隻${MON[k].n}`,need:n,xpk:'combat',xp:Math.round(MON[k].xp*n*.4),gold:Math.round(n*MON[k].gold[1]*.8)});}
  const ct=tierOf(Math.min(lvl('cooking'),lvl('fishing')));{const n=ri(10,25);opts.push({type:'cook',key:null,n:`煮好 ${n} 份食物`,need:n,xpk:'cooking',xp:Math.round(FXP[ct]*n*.5),gold:Math.round(n*price(ct)*2)});}
  {const b=MON[dunPool(S.zone).boss];opts.push({type:'dungeon',key:null,n:'完成 1 次任何難度的地城',need:1,xpk:'combat',xp:Math.round(b.xp*1.5),gold:b.lv*40});}
  {const n=ri(2,4);opts.push({type:'catch',key:null,n:`捕捉或孵化 ${n} 隻異寵`,need:n,xpk:'taming',xp:(40+lvl('taming')*6)*n,gold:n*60});}
  const pool=opts.filter(o=>!act.includes(o.type+':'+o.key));const q=pick(pool.length?pool:opts);q.id=++S.uid;q.have=0;return q;}
function fillQuests(){while(S.quests.length<3)S.quests.push(genQuest());}
function questProgress(type,key,n=1){if(!S)return;for(const q of S.quests)if(q.type===type&&(q.key==null||q.key===key)&&q.have<q.need){q.have=Math.min(q.need,q.have+n);
  if(q.have===q.need){toast(`📜 委託完成：${q.n}`);addLog('撳「任務」領取獎勵','#b99cff');}dirty();}}
function claimQuest(id){const i=S.quests.findIndex(q=>q.id===id);if(i<0)return;const q=S.quests[i];if(q.have<q.need)return;
  S.quests.splice(i,1);S.gold+=q.gold;S.qdone++;gainXP(q.xpk,q.xp);toast(`📜 領取 ${q.gold} 金同 ${q.xp.toLocaleString()} ${SK[q.xpk].n}經驗`);fillQuests();dirty();}
function hud(){if(!S)return;const st=stats();$('#who').textContent=`${S.name}・${CLS[S.cls].n}・戰鬥 ${lvl('combat')} 級`;$('#cpHud').textContent=`⚔️ 戰力 ${power(st).toLocaleString()}`;
  $('#hpTxt').textContent=`${Math.ceil(P.hp)} / ${st.hp}`;$('#hpBar').style.width=(P.hp/st.hp*100)+'%';$('#gold').textContent=S.gold.toLocaleString();
  const ap=activePet();$('#bagHud').textContent=S.inv.length>=INV_MAX?'🎒 背包滿':'';
  {const t=now(),b=[];for(const [k,e] of [['buffDef','🛡️'],['buffAs','🍃'],['buffDR','🕊️'],['buffCrit','🩸'],['buffPet','🦁']])if(P[k]>t)b.push(e+Math.ceil(P[k]-t));if(P.shield>0&&P.shieldT>t)b.push('🔰'+P.shield);$('#buffHud').textContent=b.join(' ');}
  $('#petHud').textContent=ap?`${SP[ap.sp].e} ${SP[ap.sp].n}`:'';
  document.body.classList.toggle('nomini',!!S.set.noMini);
  $('#sndBtn').textContent=S.set.snd?'🔊':'🔇';
  $('#zoneHud').textContent=Z.dun?`🏰 地城・${DIFF[Z.dun.di].n}・${Z.dun.done?'已通關':'剩 '+(Z.dun.total-Z.dun.killed)+' 隻'}`:`📍 ${ZONES[Z.id].n}`;
  const f=S.inv.filter(i=>i.k==='mat'&&MATS[i.m].heal).reduce((a,b)=>a+b.q,0);$('#eatBtn').textContent=`🍱 ${f}`;}

let hold=null,hover=null;
cv.addEventListener('pointerdown',e=>{if(!started)return;e.preventDefault();const r=handleTap((e.clientX+camX)/TS,(e.clientY+camY)/TS);
  hold={id:e.pointerId,x:e.clientX,y:e.clientY,t:now(),ground:r==='ground'};try{cv.setPointerCapture(e.pointerId);}catch(err){}});
cv.addEventListener('pointermove',e=>{if(hold&&hold.id===e.pointerId){hold.x=e.clientX;hold.y=e.clientY;}if(e.pointerType==='mouse')hover={x:e.clientX,y:e.clientY};});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,e=>{if(hold&&hold.id===e.pointerId)hold=null;});
cv.addEventListener('pointerleave',()=>{hover=null;});

/* ---------- 開始畫面 ---------- */
let chosen='warrior';
function startScreen(){const old=load();const C=$('#startCard');
  C.innerHTML=`<h1>異寵世界</h1><div class="sub">練技能、刷裝備、收集異寵的冒險原型</div>
    ${old?`<button class="btn cont" id="cont">繼續冒險：${esc(old.name)}（${CLS[old.cls].n}）</button><div class="muted" style="margin-bottom:12px">或者建立新角色（會覆蓋舊存檔）</div>`:''}
    <input id="nm" maxlength="8" placeholder="輸入角色名稱" value="">
    <div class="cls">${Object.entries(CLS).map(([k,c])=>`<button data-c="${k}" aria-pressed="${k===chosen}"><div class="ce">${c.e}</div><b>${c.n}</b><span>${c.d}</span></button>`).join('')}</div>
    <button class="btn" id="go">建立角色，開始冒險</button>`;
  C.querySelectorAll('.cls button').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.c;C.querySelectorAll('.cls button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===chosen));}));
  if(old)$('#cont').addEventListener('click',()=>begin(old,false));
  $('#go').addEventListener('click',()=>{const n=$('#nm').value.trim()||'冒險者';begin(newSave(n,chosen),true);});}
function begin(s,fresh){S=s;S.uid=S.uid||1;started=true;$('#start').style.display='none';
  SC=null;Z=getZone(S.zone);P.x=Z.camp[0];P.y=Z.camp[1];pet.x=P.x-1;pet.y=P.y;P.hp=stats().hp;
  fillQuests();buildSkillBar();save();hud();if(S.set.snd)sfx('coin');
  if(fresh){addLog('撳地面行路；撳樹伐木、撳礦石挖礦、撳湖邊漣漪釣魚');addLog('南面荒野平原有怪物，跌落的裝備會偏向你的職業');addLog('鎮內有工作台、銀行、營火同時裝店；東面傳送門通往翠影深林');addLog('右下角係戰鬥技能（電腦可按 1、2、3），📜 任務有委託可以接');}
  else addLog(`歡迎返嚟，${S.name}！`);}

/* ---------- 主迴圈 ---------- */
let last=performance.now(),hudT=0,saveT=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;SC=null;
  if(started){update(dt);hudT-=dt;saveT-=dt;achT-=dt;if(achT<=0){achT=1;checkAch();}miniT-=dt;if(miniT<=0){miniT=.25;if(!S.set.noMini)drawMini();}
    if(hudT<=0){hudT=.15;hud();updSkillBar();if(panelDirty&&curPanel)renderPanel();}if(saveT<=0&&needSave){saveT=4;needSave=false;save();}}
  render();requestAnimationFrame(loop);}
addEventListener('pagehide',()=>{if(S)save();});
addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});
Z=getZone('village');resize();startScreen();requestAnimationFrame(loop);
</script>
</body>
