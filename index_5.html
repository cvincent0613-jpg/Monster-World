<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>異寵世界・原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eefa;--panel:#fbf9fe;--panel2:#efe8fa;--ink:#2a2340;--ink2:#6c6386;--line:#ddd3ee;
  --accent:#7a4fd6;--on-accent:#ffffff;--hp:#e2526b;--gold:#b77f0c;
  --r0:#8a8a9c;--r1:#3f7ff0;--r2:#c29405;--r3:#e5701a;
  --navh:72px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
    --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
    --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726;--panel:#241e33;--panel2:#2e2742;--ink:#efe9fb;--ink2:#aa9fc6;--line:#3b3150;
  --accent:#a888f2;--on-accent:#1b1726;--hp:#f06a80;--gold:#e8b54a;
  --r0:#b4b4c2;--r1:#78a7ff;--r2:#efc43a;--r3:#ff9a45;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{position:fixed;inset:0;touch-action:none;display:block}

#hud{position:fixed;top:0;left:0;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none;z-index:5}
.hudcard{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;min-width:210px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#who{font-weight:700;font-size:15px}
.hprow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.hpbg{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#hpBar{height:100%;background:var(--hp);width:100%;transition:width .15s}
.hudsub{display:flex;gap:12px;margin-top:6px;font-size:13px}
#gold{color:var(--gold);font-weight:700}

#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;z-index:6;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#nav button{flex:1;max-width:92px;background:none;border:0;border-radius:12px;padding:6px 0 4px;color:var(--ink2);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#nav button .i{font-size:21px;line-height:1.2}
#nav button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);font-weight:700}

#panel{position:fixed;left:0;right:0;bottom:var(--navh);max-height:54vh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;display:none;flex-direction:column;z-index:7;box-shadow:0 -6px 24px rgba(30,15,60,.12)}
#panel.open{display:flex}
@media (min-width:820px){
  #panel{left:auto;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(var(--navh) + 12px);width:390px;max-height:none;
    border:1px solid var(--line);border-radius:18px}
}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.phead h2{margin:0;font-size:21px}
.x{background:var(--panel2);border:0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
#pbody{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.muted{color:var(--ink2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.slot{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;padding:0}
.slot .q{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700}
.slot.sel{outline:2px solid var(--accent);outline-offset:1px}
.slot.empty{cursor:default;opacity:.55}
.detail{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.detail h3{margin:0 0 4px;font-size:18px}
.detail ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.uq{color:var(--r3);font-size:14px;margin-top:6px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .e{font-size:24px;width:32px;text-align:center}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.lv{font-weight:700;font-size:18px;min-width:44px;text-align:right}
.eqs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eqs .slot{aspect-ratio:auto;height:74px;flex-direction:column;font-size:24px}
.eqs .slot small{font-size:11px;color:var(--ink2);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:12px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dex div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--panel2)}
.dex .big{font-size:32px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--accent);color:var(--on-accent);vertical-align:2px}
.danger{margin-top:18px;background:none;border:0;color:var(--hp);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

#log{position:fixed;left:10px;bottom:calc(var(--navh) + 8px);max-width:min(440px,70vw);pointer-events:none;z-index:4;font-size:13px}
#log div{background:color-mix(in srgb,var(--panel) 82%,transparent);border-radius:8px;padding:3px 8px;margin-top:3px;width:fit-content;transition:opacity .6s}
#toast{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;box-shadow:0 6px 20px rgba(30,15,60,.18);animation:tin .25s ease-out;text-align:center}
#toast div.leg{border:2px solid var(--r3);color:var(--r3);font-size:18px}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}

#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#start .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 22px;max-width:440px;width:100%;text-align:center}
#start h1{margin:0;font-size:56px;letter-spacing:.12em;font-weight:700;line-height:1.1}
#start .sub{color:var(--ink2);margin:8px 0 18px;font-size:15px}
#start input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.cls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.cls button{border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:14px 8px;cursor:pointer}
.cls button[aria-pressed="true"]{border-color:var(--accent)}
.cls .ce{font-size:34px}
.cls b{display:block;font-size:18px;margin-top:2px}
.cls span{display:block;font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.4}
#start .btn{width:100%;padding:12px;font-size:17px}
#start .cont{margin-bottom:14px}
</style>
</head>
<body>
<canvas id="c" aria-label="遊戲畫面"></canvas>

<div id="hud"><div class="hudcard">
  <div id="who">—</div>
  <div class="hprow"><div class="hpbg"><div id="hpBar"></div></div><span id="hpTxt">0</span></div>
  <div class="hudsub"><span>🪙 <span id="gold">0</span></span><span id="petHud"></span></div>
</div></div>

<div id="log" aria-live="polite"></div>
<div id="toast"></div>

<div id="panel" role="dialog" aria-labelledby="ptitle">
  <div class="phead"><h2 id="ptitle"></h2><button class="x" id="pclose" aria-label="關閉">✕</button></div>
  <div id="pbody"></div>
</div>

<nav id="nav">
  <button data-p="bag" aria-pressed="false"><span class="i">🎒</span>背包</button>
  <button data-p="equip" aria-pressed="false"><span class="i">🛡️</span>裝備</button>
  <button data-p="skills" aria-pressed="false"><span class="i">📈</span>技能</button>
  <button data-p="pets" aria-pressed="false"><span class="i">🐾</span>異寵</button>
  <button data-p="dex" aria-pressed="false"><span class="i">📖</span>圖鑑</button>
</nav>

<div id="start"><div class="card" id="startCard"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TS=40, MW=48, MH=36, INV_MAX=28, PET_MAX=30, KEY='yichong-world-save-v1';
const cv=$('#c'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,camX=0,camY=0;
const ecache=new Map();
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';ecache.clear();
  const nh=$('#nav').getBoundingClientRect().height;document.documentElement.style.setProperty('--navh',nh+'px');}
addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wpick=(arr,wf)=>{let t=0;for(const x of arr)t+=wf(x);let r=Math.random()*t;for(const x of arr){r-=wf(x);if(r<=0)return x;}return arr[arr.length-1];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>performance.now()/1000;

/* ---------- 資料 ---------- */
const CLS={warrior:{n:'戰士',e:'⚔️',w:'🗡️',col:'#d65a4a',d:'近身肉搏，皮厚耐打'},mage:{n:'法師',e:'🔮',w:'🪄',col:'#6d63d9',d:'遠距離法術，安全輸出'}};
const SK={combat:{n:'戰鬥',e:'⚔️'},mining:{n:'挖礦',e:'⛏️'},woodcut:{n:'伐木',e:'🪓'},smithing:{n:'鍛造',e:'🔨'},taming:{n:'馴養',e:'🐾'}};
const MATS={log:{n:'原木',e:'🪵',p:2},oak:{n:'橡木',e:'🌰',p:5},copper:{n:'銅礦石',e:'🟠',p:3},iron:{n:'鐵礦石',e:'🔩',p:6},
  gem:{n:'寶石原石',e:'💎',p:25},hide:{n:'狼皮',e:'🟫',p:4},egg:{n:'異寵蛋',e:'🥚',p:30},core:{n:'深淵礦心',e:'🔮',p:80}};
const RES={tree:{n:'普通樹',sk:'woodcut',lv:1,mat:'log',xp:25,dep:.3,resp:8},oak:{n:'橡樹',sk:'woodcut',lv:10,mat:'oak',xp:55,dep:.35,resp:10},
  copper:{n:'銅礦',sk:'mining',lv:1,mat:'copper',xp:25,dep:1,resp:6,gem:.03},iron:{n:'鐵礦',sk:'mining',lv:10,mat:'iron',xp:55,dep:1,resp:9,gem:.05}};
const MON={
  slime:{n:'史萊姆',lv:1,hp:22,atk:3,def:0,xp:22,gold:[2,6],item:.28,r:.36,spd:1.2,aggro:0},
  wolf:{n:'野狼',lv:5,hp:48,atk:7,def:2,xp:48,gold:[6,14],item:.35,e:'🐺',r:.42,spd:2.4,aggro:2.5,mats:[['hide',.6]]},
  golem:{n:'石魔',lv:10,hp:95,atk:12,def:6,xp:95,gold:[12,25],item:.45,e:'🗿',r:.45,spd:1.6,aggro:3,mats:[['iron',.5],['copper',.5]]},
  crab:{n:'深淵蟹王',lv:15,hp:420,atk:16,def:8,xp:500,gold:[80,150],item:1,items:2,boss:1,e:'🦀',r:.8,spd:1.8,aggro:4,mats:[['core',1]],egg:.35,resp:60}
};
const SPAWNS=[{t:'slime',n:7,r:[11,26,22,33]},{t:'wolf',n:5,r:[25,26,34,33]},{t:'golem',n:4,r:[35,27,39,33]},{t:'crab',n:1,r:[42,29,45,33]}];
const AFF={str:{n:'力量',r:[2,6],adj:'強壯的'},int:{n:'智力',r:[2,6],adj:'睿智的'},vit:{n:'體力',r:[4,12],adj:'堅韌的'},def:{n:'防禦',r:[1,4],adj:'堅固的'},
  crit:{n:'暴擊率',r:[2,5],pct:1,adj:'鋒利的'},life:{n:'吸血',r:[1,4],pct:1,adj:'嗜血的'},gather:{n:'採集速度',r:[3,9],pct:1,adj:'勤勞的'},xp:{n:'經驗加成',r:[2,6],pct:1,adj:'聰穎的'}};
const UNIQ=[{n:'雷霆之怒',d:'攻擊時 15% 機率造成雙倍傷害',k:'dbl',v:15},{n:'不滅之心',d:'生命上限 +25%',k:'hpPct',v:25},
  {n:'豐收祝福',d:'採集時 20% 機率多得一份',k:'extra',v:20},{n:'寵愛之證',d:'異寵天賦效果 +50%',k:'petAmp',v:50}];
const RNAME=['風暴','血月','幽影','晨曦','霜語','烈焰','星塵','翠嵐'];
const RAR=['普通','魔法','稀有','傳說'];
const BASES={
  w_warrior:[{n:'銅劍',v:4},{n:'鐵劍',v:8},{n:'深淵之刃',v:14}],
  w_mage:[{n:'木法杖',v:4},{n:'橡木法杖',v:8},{n:'星辰法杖',v:14}],
  a_warrior:[{n:'銅甲',v:3},{n:'鐵甲',v:6},{n:'深淵重鎧',v:10}],
  a_mage:[{n:'符文袍',v:2},{n:'秘紋法袍',v:4},{n:'星紗長袍',v:7}],
  ring:[{n:'銅戒指',v:0},{n:'寶石戒指',v:1},{n:'深淵指環',v:2}]
};
const RECIPES=[
  {n:'銅劍',lv:1,need:{copper:2},slot:'weapon',cls:'warrior',tier:0,il:3,xp:40},
  {n:'木法杖',lv:1,need:{log:2},slot:'weapon',cls:'mage',tier:0,il:3,xp:40},
  {n:'銅甲',lv:3,need:{copper:3},slot:'armor',cls:'warrior',tier:0,il:4,xp:60},
  {n:'符文袍',lv:3,need:{log:2,hide:1},slot:'armor',cls:'mage',tier:0,il:4,xp:60},
  {n:'寶石戒指',lv:6,need:{gem:1,copper:2},slot:'ring',cls:'any',tier:1,il:8,xp:90},
  {n:'鐵劍',lv:10,need:{iron:2},slot:'weapon',cls:'warrior',tier:1,il:11,xp:110},
  {n:'橡木法杖',lv:10,need:{oak:2},slot:'weapon',cls:'mage',tier:1,il:11,xp:110},
  {n:'鐵甲',lv:12,need:{iron:3},slot:'armor',cls:'warrior',tier:1,il:12,xp:140},
  {n:'秘紋法袍',lv:12,need:{oak:2,hide:2},slot:'armor',cls:'mage',tier:1,il:12,xp:140},
  {n:'深淵武器（自己職業）',lv:15,need:{core:1,iron:3},slot:'weapon',cls:'self',tier:2,il:16,xp:300}
];
const SP={
  fox:{n:'火狐',e:'🦊',lv:1,t:'atk',tn:'攻擊力',b:[2,4],w:30},
  sheep:{n:'綿綿羊',e:'🐑',lv:1,t:'regen',tn:'每秒回血',b:[1,2],w:30},
  turtle:{n:'礦石龜',e:'🐢',lv:5,t:'gather',tn:'採集速度',b:[6,10],w:20,pct:1},
  rabbit:{n:'星光兔',e:'🐇',lv:8,t:'xp',tn:'經驗加成',b:[5,9],w:15,pct:1},
  dragon:{n:'小龍',e:'🐉',lv:15,t:'all',tn:'攻擊與防禦',b:[3,5],w:5}
};
const PRAR=[{m:1,w:60},{m:1.4,w:28},{m:1.9,w:10},{m:2.6,w:2}];
const XPT=[0,0];{let pts=0;for(let l=1;l<99;l++){pts+=Math.floor(l+300*Math.pow(2,l/7));XPT[l+1]=Math.floor(pts/4);}}
const lvlOf=xp=>{let l=1;while(l<99&&xp>=XPT[l+1])l++;return l;};
const rarCol=r=>getComputedStyle(document.documentElement).getPropertyValue('--r'+r).trim();
const RCOL=['#c9c9d6','#5b95ff','#ffd23a','#ff8a2a'];

/* ---------- 地圖 ---------- */
let _s=20261002;const sr=()=>{_s=(_s*16807)%2147483647;return (_s-1)/2147483646;};
const G=0,W=1,PA=2,SA=3,TN=4,FL=5,DI=6;
const tile=new Uint8Array(MW*MH), obj=new Array(MW*MH).fill(null), shade=new Uint8Array(MW*MH);
const idx=(x,y)=>y*MW+x, inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
function rect(x0,y0,x1,y1,f){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y))f(x,y);}
function genMap(){
  rect(0,0,MW-1,MH-1,(x,y)=>{shade[idx(x,y)]=Math.floor(sr()*3);if(x===0||y===0||x===MW-1||y===MH-1)tile[idx(x,y)]=W;});
  rect(14,1,34,10,(x,y)=>{if(sr()<.55)tile[idx(x,y)]=FL;});
  rect(33,9,46,26,(x,y)=>tile[idx(x,y)]=SA);
  rect(10,25,46,34,(x,y)=>{if(sr()<.5)tile[idx(x,y)]=DI;});
  rect(3,1,10,7,(x,y)=>{if(Math.hypot(x-6.5,y-4)<2.8)tile[idx(x,y)]=W;});
  rect(36,1,44,7,(x,y)=>{if(Math.hypot(x-40,y-4)<2.9)tile[idx(x,y)]=W;});
  rect(18,13,29,22,(x,y)=>tile[idx(x,y)]=TN);
  rect(1,17,17,18,(x,y)=>tile[idx(x,y)]=PA);
  rect(30,17,46,18,(x,y)=>tile[idx(x,y)]=PA);
  rect(23,2,24,12,(x,y)=>tile[idx(x,y)]=PA);
  rect(23,23,24,34,(x,y)=>tile[idx(x,y)]=PA);
  rect(1,6,15,29,(x,y)=>{if(tile[idx(x,y)]===G&&sr()<.22)obj[idx(x,y)]={type:x<8?'oak':'tree',dep:0};});
  rect(34,10,45,25,(x,y)=>{if(tile[idx(x,y)]===SA&&sr()<.16)obj[idx(x,y)]={type:x>40?'iron':'copper',dep:0};});
  obj[idx(21,15)]={type:'bench'};
  obj[idx(26,15)]={type:'fountain'};
}
const blocked=(x,y)=>!inb(x,y)||tile[idx(x,y)]===W||!!obj[idx(x,y)];
const LABELS=[['起始之鎮',23.5,12.5],['寧靜森林',11.5,6.4],['赤銅礦場',39.5,8.5],['花語草原・異寵出沒',29,1.8],['荒野平原',17,24.5],['蟹王巢穴',43.5,28.4]];

function findPath(sx,sy,goal){
  const prev=new Int32Array(MW*MH).fill(-1);const s=idx(sx,sy);prev[s]=s;const q=[s];let h=0;
  while(h<q.length){const c=q[h++],cx=c%MW,cy=(c/MW)|0;
    if(goal(cx,cy)){const p=[];let k=c;while(k!==s){p.push([k%MW,(k/MW)|0]);k=prev[k];}return p.reverse();}
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;
      if(!inb(nx,ny))continue;const ni=idx(nx,ny);if(prev[ni]!==-1||blocked(nx,ny))continue;
      if(dx&&dy&&(blocked(cx+dx,cy)||blocked(cx,cy+dy)))continue;prev[ni]=c;q.push(ni);}}
  return null;
}

/* ---------- 狀態 ---------- */
let S=null, started=false;
const P={x:21.5,y:19.5,path:[],speed:4.2,hp:50,action:null,face:1,atkCd:0,lastHit:-99};
const pet={x:20.5,y:19.5};

  s.eq.weapon={k:'gear',u:1,slot:'weapon',cls,tier:0,name:cls==='warrior'?'生鏽短劍':'樹枝法杖',val:2,rar:0,aff:[],uq:null,il:1};

const lvl=k=>lvlOf(S.xp[k]);

function dirty(){needSave=true;panelDirty=true;}
const activePet=()=>S&&S.active!=null?S.pets.find(p=>p.u===S.active):null;

function stats(){

  const s={atk:2+c,def:0,hp:40+c*6,crit:5,life:0,gather:0,xp:0,dbl:0,extra:0,hpPct:0,petAmp:0,regen:0};

  s.hp=Math.round(s.hp*(1+s.hpPct/100));s.atk=Math.round(s.atk);s.def=Math.round(s.def);

/* ---------- 背包 ---------- */
const findMat=k=>S.inv.find(i=>i.k==='mat'&&i.m===k);
const hasMat=k=>{const s=findMat(k);return s?s.q:0;};
const canAddMat=k=>!!findMat(k)||S.inv.length<INV_MAX;
function addMat(k,n=1){const s=findMat(k);if(s){s.q+=n;dirty();return true;}if(S.inv.length>=INV_MAX)return false;S.inv.push({k:'mat',m:k,q:n});dirty();return true;}
function useMat(k,n){const s=findMat(k);s.q-=n;if(s.q<=0)S.inv.splice(S.inv.indexOf(s),1);dirty();}
function addItem(it){if(S.inv.length>=INV_MAX)return false;S.inv.push(it);dirty();return true;}
const sellVal=it=>it.k==='mat'?MATS[it.m].p*it.q:Math.max(1,Math.round((it.val+it.aff.reduce((a,b)=>a+b.v,0)+it.il)*(1+it.rar*1.5)));
const gearIcon=it=>it.slot==='ring'?'💍':it.slot==='weapon'?CLS[it.cls].w:(it.cls==='mage'?'🥋':'🛡️');

function genItem(il,o={}){
  const slot=o.slot||wpick([['weapon',4],['armor',4],['ring',2]],x=>x[1])[0];
  let cls=o.cls;if(cls==='self')cls=S.cls;
  if(!cls)cls=slot==='ring'?'any':(Math.random()<.7?S.cls:(S.cls==='warrior'?'mage':'warrior'));
  const tier=o.tier!=null?o.tier:(il>=14?2:il>=8?1:0);
  const base=BASES[slot==='ring'?'ring':(slot==='weapon'?'w_':'a_')+cls][tier];
  let L,R,M;
  if(o.craft!=null){L=.3+o.craft*.03;R=3+o.craft*.25;M=15+o.craft*.8;}else if(o.boss){L=6;R=25;M=40;}else{L=.9;R=7;M=22;}
  const roll=Math.random()*100;const rar=roll<L?3:roll<L+R?2:roll<L+R+M?1:0;
  const val=slot==='ring'?base.v:Math.max(1,Math.round(base.v*rnd(.9,1.15)+il*.15));
  let pool=Object.keys(AFF).filter(k=>k==='str'?(cls==='warrior'||(cls==='any'&&S.cls==='warrior')):k==='int'?(cls==='mage'||(cls==='any'&&S.cls==='mage')):true);
  const n=rar===0?0:rar===1?ri(1,2):rar===2?ri(3,4):4;const aff=[];
  for(let i=0;i<n&&pool.length;i++){const k=wpick(pool,x=>(x==='str'||x==='int')?3:1);pool=pool.filter(x=>x!==k);
    const A=AFF[k];aff.push({k,v:Math.max(1,Math.round(rnd(A.r[0],A.r[1])*(A.pct?1+il/30:1+il/12)))});}
  const uq=rar===3?{...pick(UNIQ)}:null;
  let name=base.n;
  if(rar===1&&aff.length)name=AFF[aff[0].k].adj+base.n;
  if(rar===2)name=pick(RNAME)+'・'+base.n;
  if(rar===3)name=uq.n+'・'+base.n;
  return {k:'gear',u:++S.uid,slot,cls,tier,name,val,rar,aff,uq,il};
}
function lootItem(it,x,y){
  if(!addItem(it)){const g=sellVal(it);S.gold+=g;addLog(`背包已滿，${it.name} 自動賣出 +${g} 金`);return;}
  addLog(`獲得 ${it.name}`,RCOL[it.rar]);
  if(it.rar>=2)beam(x,y,RCOL[it.rar],it.rar===3);
  if(it.rar===3)toast(`傳說掉落！${it.name}`,true);
  else if(it.rar===2&&(it.cls===S.cls||it.cls==='any'))toast(`稀有裝備：${it.name}`);
}

function randIn(r){for(let i=0;i<60;i++){const x=ri(r[0],r[2]),y=ri(r[1],r[3]);if(!blocked(x,y))return [x+.5,y+.5];}return [r[0]+.5,r[1]+.5];}
function spawnMon(t,r,m){const d=MON[t];const [x,y]=randIn(r);const o=m||{};Object.assign(o,{t,r,x,y,hp:d.hp,maxhp:d.hp,dead:false,resp:0,aggro:false,atkCd:1,goal:null,flash:0,hop:Math.random()*6});return o;}
function initWorld(){for(const s of SPAWNS)for(let i=0;i<s.n;i++)mons.push(spawnMon(s.t,s.r));for(let i=0;i<6;i++)spawnWild();}
const MEADOW=[14,2,34,10];
function spawnWild(){const sp=wpick(Object.keys(SP),k=>SP[k].w);const [x,y]=randIn(MEADOW);wild.push({sp,x,y,goal:null,hold:false,flee:0,hop:Math.random()*6});}
function steer(e,tx,ty,spd,dt){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<.02)return true;const st=Math.min(d,spd*dt);
  const nx=e.x+dx/d*st,ny=e.y+dy/d*st;if(!blocked(Math.floor(nx),Math.floor(e.y)))e.x=nx;if(!blocked(Math.floor(e.x),Math.floor(ny)))e.y=ny;return d<.1;}

/* ---------- 動作 ---------- */
function setAction(a){if(P.action&&P.action.type==='capture'&&P.action.w)P.action.w.hold=false;P.action=a;}
const ptile=()=>[Math.floor(P.x),Math.floor(P.y)];
function mark(x,y,col){marker={x,y,col,t:0};}
function goAdj(tx,ty,act){const [sx,sy]=ptile();
  const p=findPath(sx,sy,(x,y)=>Math.max(Math.abs(x-tx),Math.abs(y-ty))===1);
  if(!p){addLog('去唔到嗰度');return false;}setAction(act);P.path=p;mark(tx+.5,ty+.5,'#ffffff');return true;}
function startGather(tx,ty,o){const R=RES[o.type];
  if(o.dep>0){addLog(`${R.n}已經用完，等一陣會再生`);return;}
  if(lvl(R.sk)<R.lv){addLog(`需要${SK[R.sk].n}等級 ${R.lv} 先可以採集${R.n}`,'#ff9a9a');return;}
  if(!canAddMat(R.mat)){toast('背包已滿');return;}
  goAdj(tx,ty,{type:'gather',ox:tx,oy:ty,t:0});}
function startCapture(w){const d=SP[w.sp];
  if(lvl('taming')<d.lv){addLog(`需要馴養等級 ${d.lv} 先可以捕捉${d.n}`,'#ff9a9a');return;}
  if(S.pets.length>=PET_MAX){toast('異寵欄已滿，先放生一啲');return;}
  const tx=Math.floor(w.x),ty=Math.floor(w.y),[sx,sy]=ptile();
  const p=findPath(sx,sy,(x,y)=>Math.max(Math.abs(x-tx),Math.abs(y-ty))<=1&&!(x===tx&&y===ty));
  if(!p){addLog('去唔到嗰度');return;}setAction({type:'capture',w,t:0});w.hold=true;P.path=p;mark(w.x,w.y,'#ffd1f0');}
function handleTap(wx,wy){
  for(const m of mons){if(!m.dead&&Math.hypot(wx-m.x,wy-m.y)<MON[m.t].r+.4){setAction({type:'attack',m,rp:0});P.path=[];mark(m.x,m.y,'#ff6b6b');return;}}
  for(const w of wild){if(Math.hypot(wx-w.x,wy-(w.y-.15))<.65){startCapture(w);return;}}
  const tx=Math.floor(wx),ty=Math.floor(wy);if(!inb(tx,ty))return;const o=obj[idx(tx,ty)];
  if(o){if(RES[o.type])return startGather(tx,ty,o);goAdj(tx,ty,o.type==='bench'?{type:'bench'}:null);return;}
  if(blocked(tx,ty))return;
  setAction(null);const [sx,sy]=ptile();const p=findPath(sx,sy,(x,y)=>x===tx&&y===ty);if(p){P.path=p;mark(tx+.5,ty+.5,'#ffffff');}
}
const nearBench=()=>{const [x,y]=ptile();return Math.max(Math.abs(x-21),Math.abs(y-15))<=1;};

function playerHit(m){
  if(m.dead)return;const st=stats(),d=MON[m.t];
  let dmg=st.atk*rnd(.85,1.15);const crit=Math.random()<st.crit/100;if(crit)dmg*=1.8;if(st.dbl&&Math.random()<st.dbl/100)dmg*=2;
  dmg=Math.max(1,Math.round(dmg-d.def*.5));m.hp-=dmg;m.flash=.15;m.aggro=true;
  floater(m.x,m.y-.7,(crit?'暴擊 ':'')+dmg,crit?'#ffb43a':'#ffffff',crit?17:14);
  if(st.life)P.hp=Math.min(st.hp,P.hp+dmg*st.life/100);
  if(m.hp<=0)killMon(m);
}
function killMon(m){
  const d=MON[m.t];m.dead=true;m.resp=d.resp||12;m.aggro=false;
  if(P.action&&P.action.m===m)setAction(null);
  gainXP('combat',d.xp);const g=ri(d.gold[0],d.gold[1]);S.gold+=g;floater(m.x,m.y-.2,`+${g} 金`,'#ffd36b',13);
  const il=d.lv+ri(0,2);
  for(let i=0;i<(d.items||1);i++)if(Math.random()<d.item)lootItem(genItem(il,{boss:d.boss}),m.x+i*.4,m.y);
  for(const [k,p] of (d.mats||[]))if(Math.random()<p){if(addMat(k))addLog(`獲得 ${MATS[k].e} ${MATS[k].n}`);}
  if(Math.random()<(d.egg||.04)&&addMat('egg')){toast('🥚 獲得異寵蛋！喺背包孵化');beam(m.x,m.y,'#ff9ee0',false);}
  if(d.boss)addLog('擊敗深淵蟹王！','#ff9a45');
  dirty();
}
function die(){
  addLog('你被擊倒了，喺起始之鎮復活','#ff8a8a');P.x=21.5;P.y=19.5;pet.x=20.5;pet.y=19.5;P.path=[];setAction(null);P.hp=stats().hp;
  for(const m of mons)if(m.aggro){m.aggro=false;m.hp=m.maxhp;}
}

/* ---------- 製作與異寵 ---------- */
function craft(i){const r=RECIPES[i];
  if(!nearBench())return toast('要企喺工作台旁邊先可以製作');
  if(lvl('smithing')<r.lv)return toast(`需要鍛造等級 ${r.lv}`);
  for(const k in r.need)if(hasMat(k)<r.need[k])return toast('材料唔夠');
  for(const k in r.need)useMat(k,r.need[k]);
  if(S.inv.length>=INV_MAX){for(const k in r.need)addMat(k,r.need[k]);return toast('背包已滿');}
  const it=genItem(r.il,{slot:r.slot,cls:r.cls,tier:r.tier,craft:lvl('smithing')});
  addItem(it);gainXP('smithing',r.xp);addLog(`製作了 ${it.name}`,RCOL[it.rar]);
  if(it.rar>=2){beam(21.5,15.5,RCOL[it.rar],it.rar===3);toast((it.rar===3?'傳說級作品！':'稀有作品！')+it.name,it.rar===3);}
}
function makePet(sp){const r=PRAR.indexOf(wpick(PRAR,x=>x.w)),shiny=Math.random()<.03,d=SP[sp];
  let v=rnd(d.b[0],d.b[1])*PRAR[r].m*(shiny?1.2:1);v=d.t==='regen'?Math.round(v*10)/10:Math.max(1,Math.round(v));
  return {u:++S.uid,sp,r,shiny,val:v};}
function gotPet(p,x,y){S.pets.push(p);const dx=S.dex[p.sp]||{};dx.c=1;if(p.shiny)dx.s=1;S.dex[p.sp]=dx;
  if(S.active==null)S.active=p.u;const d=SP[p.sp];
  const label=`${p.shiny?'閃光':''}${RAR[p.r]}${d.n}`;toast(`${d.e} 得到 ${label}！`,p.r===3||p.shiny);addLog(`得到異寵：${label}`,RCOL[p.r]);
  if(p.r>=2||p.shiny)beam(x,y,p.shiny?'#9ff3ff':RCOL[p.r],p.r===3||p.shiny);dirty();}
function hatch(){if(S.pets.length>=PET_MAX)return toast('異寵欄已滿');
  const L=lvl('taming');const pool=Object.keys(SP).filter(k=>SP[k].lv<=L);
  useMat('egg',1);const sp=wpick(pool,k=>SP[k].w);gotPet(makePet(sp),P.x,P.y);gainXP('taming',40);}

/* ---------- 更新 ---------- */
function updatePlayer(dt){
  P.atkCd=Math.max(0,P.atkCd-dt);
  if(P.path.length){const [tx,ty]=P.path[0],gx=tx+.5,gy=ty+.5,dx=gx-P.x,dy=gy-P.y,d=Math.hypot(dx,dy),st=P.speed*dt;
    if(Math.abs(dx)>.01)P.face=dx<0?-1:1;
    if(d<=st){P.x=gx;P.y=gy;P.path.shift();}else{P.x+=dx/d*st;P.y+=dy/d*st;}}
  const a=P.action;if(!a)return;
  if(a.type==='attack'){const m=a.m;if(m.dead){setAction(null);return;}
    const range=S.cls==='warrior'?1.15+MON[m.t].r*.6:4.6,d=Math.hypot(P.x-m.x,P.y-m.y);
    if(d>range){a.rp-=dt;if(a.rp<=0||!P.path.length){a.rp=.35;const [sx,sy]=ptile();P.path=findPath(sx,sy,(x,y)=>Math.hypot(x+.5-m.x,y+.5-m.y)<=range-.25)||[];}return;}
    P.path=[];P.face=m.x<P.x?-1:1;
    if(P.atkCd<=0){P.atkCd=S.cls==='warrior'?.9:1.15;m.aggro=true;
      if(S.cls==='warrior')playerHit(m);else projs.push({x:P.x,y:P.y-.3,m});}
    return;}
  if(P.path.length)return;
  if(a.type==='bench'){setAction(null);openPanel('craft');return;}
  if(a.type==='gather'){const o=obj[idx(a.ox,a.oy)];if(!o||o.dep>0){setAction(null);return;}const R=RES[o.type];
    if(!canAddMat(R.mat)){setAction(null);toast('背包已滿');return;}
    P.face=a.ox+.5<P.x?-1:1;a.t+=dt*(1+stats().gather/100);
    if(a.t>=1.8){a.t=0;const ch=Math.min(.95,.45+(lvl(R.sk)-R.lv)*.03);
      if(Math.random()<ch){addMat(R.mat);floater(a.ox+.5,a.oy,`+1 ${MATS[R.mat].e}`,'#ffffff',13);
        const st=stats();if(st.extra&&Math.random()<st.extra/100&&addMat(R.mat))floater(a.ox+.5,a.oy-.4,'豐收 +1','#ffb43a',13);
        gainXP(R.sk,R.xp);
        if(R.gem&&Math.random()<R.gem&&addMat('gem')){toast('💎 挖到寶石原石！');beam(a.ox+.5,a.oy+.5,'#7fe3ff',false);}
        if(Math.random()<R.dep){o.dep=R.resp;depleted.push(o);setAction(null);}}
      else floater(a.ox+.5,a.oy,'失手','#cfcfe0',11);}
    return;}
  if(a.type==='capture'){const w=a.w;if(!wild.includes(w)){setAction(null);return;}
    if(Math.hypot(P.x-w.x,P.y-w.y)>1.8){setAction(null);return;}
    P.face=w.x<P.x?-1:1;a.t+=dt;
    if(a.t>=1.3){const d=SP[w.sp],ch=Math.min(.9,.35+(lvl('taming')-d.lv)*.04);
      if(Math.random()<ch){wild.splice(wild.indexOf(w),1);P.action=null;gainXP('taming',25+d.lv*5);gotPet(makePet(w.sp),w.x,w.y);}
      else{w.hold=false;w.flee=3;P.action=null;gainXP('taming',5);addLog(`${d.n}走甩咗！再試多次`);}}
  }
}
let spawnT=0;
function update(dt){
  const t=now();
  updatePlayer(dt);
  const st=stats();
  for(const m of mons){const d=MON[m.t];
    if(m.dead){m.resp-=dt;if(m.resp<=0)spawnMon(m.t,m.r,m);continue;}
    m.flash=Math.max(0,m.flash-dt);m.hop+=dt*(m.aggro?9:4);
    const dist=Math.hypot(P.x-m.x,P.y-m.y);
    if(!m.aggro&&d.aggro&&dist<d.aggro)m.aggro=true;
    if(m.aggro){const r=m.r;
      if(P.x<r[0]-4||P.x>r[2]+5||P.y<r[1]-4||P.y>r[3]+5){m.aggro=false;m.hp=m.maxhp;m.goal=null;continue;}
      if(dist>.85+d.r*.6)steer(m,P.x,P.y,d.spd,dt);
      else{m.atkCd-=dt;if(m.atkCd<=0){m.atkCd=1.4;const dmg=Math.max(1,Math.round(d.atk*rnd(.8,1.2)-st.def*.6));
        P.hp-=dmg;P.lastHit=t;floater(P.x,P.y-.8,'-'+dmg,'#ff6b6b',14);if(P.hp<=0)die();}}}
    else{if(!m.goal||Math.random()<.004){m.goal=Math.random()<.5?randIn(m.r):[m.x,m.y];}
      if(steer(m,m.goal[0],m.goal[1],d.spd*.35,dt))m.goal=null;}
  }
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];if(p.m.dead){projs.splice(i,1);continue;}
    const dx=p.m.x-p.x,dy=p.m.y-.3-p.y,d=Math.hypot(dx,dy);if(d<.3){playerHit(p.m);projs.splice(i,1);continue;}
    const s=Math.min(d,10*dt);p.x+=dx/d*s;p.y+=dy/d*s;}
  for(const w of wild){w.hop+=dt*5;if(w.hold)continue;
    if(w.flee>0){w.flee-=dt;const dx=w.x-P.x,dy=w.y-P.y,d=Math.hypot(dx,dy)||1;steer(w,w.x+dx/d,w.y+dy/d,3,dt);continue;}
    if(!w.goal||Math.random()<.003)w.goal=randIn(MEADOW);if(steer(w,w.goal[0],w.goal[1],.9,dt))w.goal=null;}
  spawnT-=dt;if(spawnT<=0){spawnT=6;if(wild.length<6)spawnWild();}
  for(let i=depleted.length-1;i>=0;i--){const o=depleted[i];o.dep-=dt;if(o.dep<=0){o.dep=0;depleted.splice(i,1);}}
  const ap=activePet();
  if(ap){const tx=P.x-.75*P.face,ty=P.y+.25,dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy);
    if(d>8){pet.x=tx;pet.y=ty;}else if(d>.15){const s=Math.min(d,(d>2?7:3.5)*dt);pet.x+=dx/d*s;pet.y+=dy/d*s;}}
  let rg=st.regen;if(t-P.lastHit>4)rg+=st.hp*.02;if(Math.hypot(P.x-26.5,P.y-15.5)<2.6)rg+=st.hp*.12;
  P.hp=Math.min(st.hp,P.hp+rg*dt);
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.y-=dt*.7;if(f.t>1.2)floaters.splice(i,1);}
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;if(b.t>b.dur)beams.splice(i,1);}
  if(marker){marker.t+=dt;if(marker.t>.6)marker=null;}
}

function emo(e,size,shiny){const key=e+'|'+size+(shiny?'s':'');let c=ecache.get(key);
  if(!c){c=document.createElement('canvas');const s=Math.ceil(size*1.35*DPR);c.width=c.height=s;const g=c.getContext('2d');
    g.textAlign='center';g.textBaseline='middle';g.font=`${size*DPR}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    if(shiny&&'filter' in g)g.filter='hue-rotate(160deg) saturate(1.5)';g.fillText(e,s/2,s/2+size*DPR*.07);ecache.set(key,c);}
  return c;}
function drawEmo(e,x,y,size,shiny,flip){const c=emo(e,size,shiny),s=c.width/DPR;
  if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(c,-s/2,-s/2,s,s);ctx.restore();}else ctx.drawImage(c,x-s/2,y-s/2,s,s);}
const TCOL={[G]:['#86c56f','#80bf69','#8bca74'],[FL]:['#8ccb73','#86c56d','#91cf79'],[W]:['#4f9fd6','#4a99cf','#54a5db'],[PA]:['#e0c99a','#dcc595','#e3cda0'],
  [SA]:['#dcbf92','#d6b88a','#e0c398'],[TN]:['#d3c6e4','#cdbfe0','#d8ccE8'],[DI]:['#b6bb72','#adb36a','#bbc078']};
const FLC=['#ff8fb1','#fff27a','#ffffff','#c9a6ff'];
function label(t,x,y,size,col,stroke){ctx.font=`700 ${size}px "LXGW WenKai TC","PingFang TC",sans-serif`;ctx.textAlign='center';ctx.lineWidth=3;
  ctx.strokeStyle=stroke||'rgba(40,25,60,.75)';ctx.strokeText(t,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);}
function hpbar(x,y,w,f,col){ctx.fillStyle='rgba(30,20,40,.65)';ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=col;ctx.fillRect(x-w/2,y,w*clamp(f,0,1),5);}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const mw=MW*TS,mh=MH*TS;
  camX=mw<VW?(mw-VW)/2:clamp(P.x*TS-VW/2,0,mw-VW);
  camY=mh<VH?(mh-VH)/2:clamp(P.y*TS-VH/2+30,0,mh-VH);
  camX=Math.round(camX);camY=Math.round(camY);
  ctx.fillStyle='#4a99cf';ctx.fillRect(0,0,VW,VH);
  ctx.translate(-camX,-camY);
  const x0=Math.max(0,Math.floor(camX/TS)),x1=Math.min(MW-1,Math.floor((camX+VW)/TS)),y0=Math.max(0,Math.floor(camY/TS)),y1=Math.min(MH-1,Math.floor((camY+VH)/TS));
  const tt=now();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=idx(x,y),t=tile[i];ctx.fillStyle=TCOL[t][shade[i]];ctx.fillRect(x*TS,y*TS,TS,TS);
    if(t===FL){for(let k=0;k<3;k++){const h=(i*31+k*17)%97;ctx.fillStyle=FLC[(i+k)%4];ctx.beginPath();ctx.arc(x*TS+6+(h%28),y*TS+6+((h*7)%28),2.2,0,7);ctx.fill();}}
    else if(t===W){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();const o=Math.sin(tt*1.5+i)*4;ctx.moveTo(x*TS+8+o,y*TS+20);ctx.lineTo(x*TS+20+o,y*TS+20);ctx.stroke();}
    else if(t===TN){ctx.strokeStyle='rgba(120,100,150,.18)';ctx.lineWidth=1;ctx.strokeRect(x*TS+.5,y*TS+.5,TS-1,TS-1);}}
  for(const [t,x,y] of LABELS)label(t,x*TS,y*TS,15,'#ffffff');
  if(marker){ctx.strokeStyle=marker.col;ctx.globalAlpha=1-marker.t/.6;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(marker.x*TS,marker.y*TS+10,10+marker.t*20,5+marker.t*10,0,0,7);ctx.stroke();ctx.globalAlpha=1;}
  const ds=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=obj[idx(x,y)];if(o)ds.push({y:y+.5,k:'o',o,x,ty:y});}
  for(const m of mons)if(!m.dead)ds.push({y:m.y,k:'m',m});
  for(const w of wild)ds.push({y:w.y,k:'w',w});
  ds.push({y:P.y,k:'p'});
  const ap=activePet();if(ap)ds.push({y:pet.y,k:'pet',p:ap});
  ds.sort((a,b)=>a.y-b.y);
  for(const d of ds){
    if(d.k==='o')drawObj(d.o,d.x,d.ty);
    else if(d.k==='m')drawMon(d.m,tt);
    else if(d.k==='w'){const w=d.w,s=SP[w.sp],px=w.x*TS,py=w.y*TS,b=Math.abs(Math.sin(w.hop))*5;
      ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(px,py+10,11,4,0,0,7);ctx.fill();
      if(w.sp==='dragon'){ctx.fillStyle='rgba(255,220,120,.35)';ctx.beginPath();ctx.arc(px,py-6,20,0,7);ctx.fill();}
      drawEmo(s.e,px,py-6-b,28);if(w.hold)label(`捕捉 ${s.n}`,px,py-30,12,'#ffd1f0');}
    else if(d.k==='p')drawPlayer();
    else if(d.k==='pet'){const s=SP[d.p.sp],b=Math.abs(Math.sin(tt*6))*3;const px=pet.x*TS,py=pet.y*TS;
      ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(px,py+9,9,3.5,0,0,7);ctx.fill();
      drawEmo(s.e,px,py-5-b,24,d.p.shiny,P.face>0);if(d.p.shiny)drawEmo('✨',px+11,py-18-b,12);}
  }
  for(const p of projs){ctx.fillStyle='#b9a6ff';ctx.beginPath();ctx.arc(p.x*TS,p.y*TS,5,0,7);ctx.fill();ctx.fillStyle='rgba(185,166,255,.35)';ctx.beginPath();ctx.arc(p.x*TS,p.y*TS,10,0,7);ctx.fill();}
  ctx.globalCompositeOperation='lighter';
  for(const b of beams){const a=Math.min(1,(b.dur-b.t)/.8)*Math.min(1,b.t/.15),h=b.big?300:180,w=b.big?30:20,px=b.x*TS,py=b.y*TS;
    const g=ctx.createLinearGradient(0,py,0,py-h);g.addColorStop(0,b.col);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=a*.85;ctx.fillStyle=g;ctx.fillRect(px-w/2,py-h,w,h);
    ctx.globalAlpha=a*.6;ctx.strokeStyle=b.col;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(px,py,w+b.t*14,(w+b.t*14)/2.4,0,0,7);ctx.stroke();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  for(const f of floaters){ctx.globalAlpha=clamp(1.3-f.t,0,1);label(f.txt,f.x*TS,f.y*TS,f.sz,f.col);}
  ctx.globalAlpha=1;
}
function drawObj(o,x,y){const px=x*TS+TS/2,py=y*TS+TS/2;
  if(o.type==='tree'||o.type==='oak'){
    if(o.dep>0){ctx.fillStyle='#8a6440';ctx.beginPath();ctx.ellipse(px,py+8,9,5,0,0,7);ctx.fill();ctx.fillStyle='#c79d6b';ctx.beginPath();ctx.ellipse(px,py+6,7,3.5,0,0,7);ctx.fill();return;}
    ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(px,py+13,15,5,0,0,7);ctx.fill();
    drawEmo(o.type==='oak'?'🌲':'🌳',px,py-6,40);return;}
  if(o.type==='copper'||o.type==='iron'){const dep=o.dep>0;
    ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(px,py+11,15,5,0,0,7);ctx.fill();
    ctx.fillStyle=dep?'#9b97a0':'#8a8693';ctx.beginPath();ctx.ellipse(px,py+(dep?6:2),dep?12:16,dep?6:12,0,0,7);ctx.fill();
    ctx.fillStyle=dep?'#b2aeb8':'#a7a3b0';ctx.beginPath();ctx.ellipse(px-3,py-(dep?-3:3),dep?7:10,dep?3:6,0,0,7);ctx.fill();
    if(!dep){ctx.fillStyle=o.type==='copper'?'#e0782a':'#3e4654';for(const [a,b] of [[-7,2],[5,-3],[6,6],[-2,7]]){ctx.beginPath();ctx.arc(px+a,py+b,2.6,0,7);ctx.fill();}}
    return;}
  if(o.type==='bench'){ctx.fillStyle='#8a6440';ctx.fillRect(px-17,py-6,34,16);ctx.fillStyle='#a87d52';ctx.fillRect(px-17,py-9,34,6);drawEmo('🔨',px,py-14,22);label('工作台',px,py+26,12,'#ffffff');return;}
  if(o.type==='fountain'){ctx.fillStyle='#9fc4e8';ctx.beginPath();ctx.ellipse(px,py+6,19,10,0,0,7);ctx.fill();drawEmo('⛲',px,py-6,34);label('噴泉・回血',px,py+28,12,'#ffffff');}
}
function drawMon(m,tt){const d=MON[m.t],px=m.x*TS,py=m.y*TS,b=Math.abs(Math.sin(m.hop))*(m.t==='slime'?4:2);
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(px,py+10,d.r*TS*.75,d.r*TS*.28,0,0,7);ctx.fill();

    ctx.fillStyle='#24402a';ctx.beginPath();ctx.arc(px-5,py-1-b,2,0,7);ctx.arc(px+5,py-1-b,2,0,7);ctx.fill();}

function drawPlayer(){const px=P.x*TS,py=P.y*TS,c=CLS[S?S.cls:'warrior'],moving=P.path.length>0,b=moving?Math.abs(Math.sin(now()*12))*3:0;

  else if(curPanel==='craft'){const L=lvl('smithing'),nb=nearBench();
    h+=`<div class="muted" style="margin-bottom:6px">鍛造等級 ${L}。等級愈高，做出稀有和傳說裝備的機會愈大。${nb?'':'<b>（要企喺工作台旁邊先可以製作）</b>'}</div>`;
    RECIPES.forEach((r,i)=>{const ok=L>=r.lv&&Object.keys(r.need).every(k=>hasMat(k)>=r.need[k]);
      const forMe=r.cls==='any'||r.cls==='self'||r.cls===S.cls;
      h+=`<div class="row"><div class="e">${r.slot==='ring'?'💍':r.slot==='weapon'?CLS[r.cls==='self'?S.cls:r.cls].w:(r.cls==='mage'?'🥋':'🛡️')}</div><div class="main">
        <div class="t">${r.n}${forMe?'':'<span class="muted">（'+CLS[r.cls].n+'用）</span>'}</div>
        <div class="muted">需要鍛造 ${r.lv} 級・${Object.entries(r.need).map(([k,n])=>`${MATS[k].e}${MATS[k].n} ${hasMat(k)}/${n}`).join('　')}</div></div>
        <button class="btn" data-a="craft" data-r="${i}" ${ok&&nb?'':'disabled'}>製作</button></div>`;});
  }
  B.innerHTML=h;B.scrollTop=sc;panelDirty=false;
}
$('#pbody').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const a=t.dataset.a;
  if(t.dataset.i!=null){const it=S.inv[+t.dataset.i];sel=sel===it?null:it;renderPanel();return;}
  if(t.dataset.eq){const it=S.eq[t.dataset.eq];sel=sel===it?null:it;renderPanel();return;}
  if(a==='equip'&&sel){if(sel.cls!=='any'&&sel.cls!==S.cls)return;const i=S.inv.indexOf(sel),old=S.eq[sel.slot];S.eq[sel.slot]=sel;if(old)S.inv[i]=old;else S.inv.splice(i,1);
    addLog(`裝備了 ${sel.name}`,RCOL[sel.rar]);sel=null;P.hp=Math.min(P.hp,stats().hp);dirty();renderPanel();}
  else if(a==='unequip'&&sel){if(S.inv.length>=INV_MAX)return toast('背包已滿');S.eq[sel.slot]=null;S.inv.push(sel);sel=null;P.hp=Math.min(P.hp,stats().hp);dirty();renderPanel();}
  else if(a==='sell'&&sel){const g=sellVal(sel);S.gold+=g;S.inv.splice(S.inv.indexOf(sel),1);addLog(`賣出 +${g} 金`,'#ffd36b');sel=null;dirty();renderPanel();}
  else if(a==='hatch'){hatch();if(!findMat('egg'))sel=null;renderPanel();}
  else if(a==='craft')craft(+t.dataset.r);
  else if(a==='out'||a==='rest'||a==='free'){const u=+t.dataset.pet;
    if(a==='out'){S.active=u;const ap=activePet();pet.x=P.x;pet.y=P.y;addLog(`${SP[ap.sp].n} 出戰！`);}
    else if(a==='rest')S.active=null;
    else{if(pendingFree!==u){pendingFree=u;renderPanel();return;}pendingFree=null;S.pets=S.pets.filter(x=>x.u!==u);if(S.active===u)S.active=null;}
    P.hp=Math.min(P.hp,stats().hp);dirty();renderPanel();}
  else if(a==='reset'){if(!pendingReset){pendingReset=true;renderPanel();return;}try{localStorage.removeItem(KEY);}catch(err){}location.reload();}
});
$('#pclose').addEventListener('click',closePanel);
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(started)openPanel(b.dataset.p);}));
function hud(){if(!S)return;const st=stats();$('#who').textContent=`${S.name}・${CLS[S.cls].n}・戰鬥 ${lvl('combat')} 級`;
  $('#hpTxt').textContent=`${Math.ceil(P.hp)} / ${st.hp}`;$('#hpBar').style.width=(P.hp/st.hp*100)+'%';$('#gold').textContent=S.gold;
  const ap=activePet();$('#petHud').textContent=ap?`${SP[ap.sp].e} ${SP[ap.sp].n}`:'';}

cv.addEventListener('pointerdown',e=>{if(!started)return;e.preventDefault();handleTap((e.clientX+camX)/TS,(e.clientY+camY)/TS);});

/* ---------- 開始畫面 ---------- */
let chosen='warrior';
function startScreen(){const old=load();const C=$('#startCard');
  C.innerHTML=`<h1>異寵世界</h1><div class="sub">練技能、刷裝備、收集異寵的冒險原型</div>
    ${old?`<button class="btn cont" id="cont">繼續冒險：${esc(old.name)}（${CLS[old.cls].n}）</button><div class="muted" style="margin-bottom:12px">或者建立新角色（會覆蓋舊存檔）</div>`:''}
    <input id="nm" maxlength="8" placeholder="輸入角色名稱" value="">
    <div class="cls">${Object.entries(CLS).map(([k,c])=>`<button data-c="${k}" aria-pressed="${k===chosen}"><div class="ce">${c.e}</div><b>${c.n}</b><span>${c.d}</span></button>`).join('')}</div>
    <button class="btn" id="go">建立角色，開始冒險</button>`;
  C.querySelectorAll('.cls button').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.c;C.querySelectorAll('.cls button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===chosen));}));
  if(old)$('#cont').addEventListener('click',()=>begin(old,false));
  $('#go').addEventListener('click',()=>{const n=$('#nm').value.trim()||'冒險者';begin(newSave(n,chosen),true);});}
function begin(s,fresh){S=s;S.uid=S.uid||1;started=true;$('#start').style.display='none';P.hp=stats().hp;
  const ap=activePet();if(ap){pet.x=P.x-1;pet.y=P.y;}
  save();hud();
  if(fresh){addLog('撳地面行路；撳樹伐木、撳礦石挖礦');addLog('南面荒野平原有怪物，跌落的裝備會偏向你的職業');addLog('北面花語草原可以捕捉異寵；鎮內工作台可以製作裝備');}
  else addLog(`歡迎返嚟，${S.name}！`);}

/* ---------- 主迴圈 ---------- */
let last=performance.now(),hudT=0,saveT=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(started){update(dt);hudT-=dt;saveT-=dt;if(hudT<=0){hudT=.15;hud();if(panelDirty&&curPanel)renderPanel();}if(saveT<=0&&needSave){saveT=4;needSave=false;save();}}
  render();requestAnimationFrame(loop);}
addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});
genMap();resize();initWorld();startScreen();requestAnimationFrame(loop);
</script>
</body>
